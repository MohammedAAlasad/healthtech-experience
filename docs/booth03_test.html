<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booth 03 TEST stand-in — Read the Scan</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f1fa; color: #1d1530; font-size: 20px; }
  header { background: #4b2c91; color: #fff; padding: 14px 24px; font-size: 1.5rem; font-weight: 800; }
  header small { display: block; font-size: .85rem; font-weight: 500; opacity: .85; }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 18px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .pts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 20px 0; }
  .pts button, .again { min-height: 88px; font-size: 2rem; font-weight: 900; border: 0; border-radius: 14px; background: #4b2c91; color: #fff; cursor: pointer; }
  .pts button:disabled { opacity: .5; cursor: wait; }
  .again { width: 100%; font-size: 1.5rem; min-height: 72px; background: #0a7e8c; }
  .msg { font-size: 1.3rem; font-weight: 800; padding: 14px; border-radius: 12px; background: #eee; margin: 12px 0; min-height: 1.4em; }
  .ok { background: #e3f6e8; color: #1b8a3a; } .warn { background: #fff4e0; color: #8a5300; } .err { background: #fde7ea; color: #b00020; }
</style>
</head>
<body>
<header>Booth 03 — Read the Scan (TEST STAND-IN)<small>Only for testing the shared system before the real Booth 03 exists.</small></header>
<main><div class="card" id="app"></div></main>

<script src="shared.js"></script>
<script>
(function () {
  const app = document.getElementById("app");

  function checkIn() {
    startCheckIn(app, play, { title: "Booth 03 — Participant check-in" });
  }

  function play({ studentId, name }) {
    app.textContent = "";
    const h2 = document.createElement("h2");
    h2.textContent = "Player: " + name;
    const p = document.createElement("p");
    p.textContent = "Pretend the game is over. Pick the points this player earned:";
    const grid = document.createElement("div");
    grid.className = "pts";
    const msg = document.createElement("div");
    msg.className = "msg";
    const again = document.createElement("button");
    again.className = "again";
    again.textContent = "New Participant";
    again.onclick = checkIn;

    [0, 10, 20, 30].forEach((pts) => {
      const b = document.createElement("button");
      b.textContent = pts;
      b.id = "pts" + pts;
      b.onclick = async () => {
        grid.querySelectorAll("button").forEach((x) => (x.disabled = true));
        msg.className = "msg";
        msg.textContent = "Saving…";
        try {
          const r = await saveScore(studentId, "booth03", pts, { attemptId: htMakeId(), rounds: [{ test: true, points: pts }] });
          if (r.queued) { msg.className = "msg warn"; msg.textContent = "Offline: stored on this device, will be sent automatically."; }
          else if (r.counted) { msg.className = "msg ok"; msg.textContent = pts + " points added to the leaderboard"; }
          else { msg.className = "msg warn"; msg.textContent = "Practice attempt — not counted"; }
        } catch (err) {
          msg.className = "msg err";
          msg.textContent = "Could not save: " + err.message;
          grid.querySelectorAll("button").forEach((x) => (x.disabled = false));
        }
      };
      grid.appendChild(b);
    });
    app.append(h2, p, grid, msg, again);
  }

  checkIn();
})();
</script>
</body>
</html>
