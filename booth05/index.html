<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booth 05 — Virtual Patient</title>
<style>
  :root {
    --bg: #070b0d; --panel: #11191d; --panel2: #18242a; --ink: #f2f7f9; --muted: #9db0b7; --line: #2a3a41;
    --teal: #2ec4d6; --ok: #3ddc84; --ok-bg: rgba(61,220,132,.16); --bad: #ff5c6c; --bad-bg: rgba(255,92,108,.15);
    --warn: #ffb02e; --ai: #b58cff; --gold: #ffcf3f; --listen: #ff4d5e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 22px; }
  @media (max-height: 920px) { html, body { font-size: 19px; } }
  [hidden] { display: none !important; }
  .banner { background: #c4001d; color: #fff; text-align: center; font-weight: 800; padding: 10px 16px; font-size: 1.15rem; }
  .banner.voice { background: var(--warn); color: #241800; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 24px;
    background: #0c1316; border-bottom: 1px solid var(--line); }
  .brand { font-size: 1.6rem; font-weight: 900; }
  .brand small { display: block; font-size: .85rem; font-weight: 500; color: var(--muted); }
  .top-right { display: flex; align-items: center; gap: 12px; }
  .player { font-size: 1.3rem; font-weight: 800; text-align: right; margin-right: 8px; }
  .tool-btn { min-height: 56px; min-width: 56px; font: inherit; font-size: 1.05rem; font-weight: 800; color: var(--ink);
    background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 0 16px; cursor: pointer; }
  .tool-btn[aria-pressed="true"] { border-color: var(--teal); color: var(--teal); }
  .timer { display: flex; align-items: center; gap: 16px; padding: 8px 24px; background: #0c1316; border-bottom: 1px solid var(--line); }
  .timer-track { flex: 1; height: 24px; background: #22323a; border-radius: 12px; overflow: hidden; }
  .timer-fill { height: 100%; width: 100%; background: var(--ok); transition: width .25s linear, background-color .5s; }
  .timer-fill.mid { background: var(--warn); }
  .timer-fill.low { background: var(--bad); }
  .timer-text { font-size: 2rem; font-weight: 900; min-width: 4.2ch; text-align: right; font-variant-numeric: tabular-nums; }
  main { padding: 18px 24px 32px; max-width: 1880px; margin: 0 auto; }
  h1, h2, h3 { margin: 0 0 12px; }
  button { font: inherit; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  .step { font-size: 1rem; font-weight: 800; color: var(--teal); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 1.05rem; margin: 0 0 12px; }
  .big-btn { min-height: 72px; min-width: 56px; font-size: 1.5rem; font-weight: 900; border: 0; border-radius: 14px; padding: 10px 32px;
    background: var(--teal); color: #031417; cursor: pointer; }
  .big-btn.alt { background: var(--panel2); color: var(--ink); border: 2px solid var(--line); }
  .big-btn:disabled { background: #3b4f57; color: #9fb3b8; cursor: not-allowed; border-color: transparent; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 16px; }
  .row-actions .grow { flex: 1; }

  /* Check-in (shared.js form) on the dark theme */
  .checkin-card { max-width: 760px; margin: 4vh auto 0; }
  #app .ht-input { background: #0b1215; color: var(--ink); border-color: #4b6670; }
  #app .ht-input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(46,196,214,.3); }
  #app .ht-err { color: var(--bad); }
  #app .ht-btn { background: var(--teal); color: #031417; min-height: 72px; }
  #app .ht-welcome { color: var(--ink); }

  /* Layout: patient on the left, interaction on the right */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 22px; align-items: start; }
  @media (max-width: 1000px) { .stage { grid-template-columns: 1fr; } }
  .patient { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column;
    align-items: center; gap: 8px; }
  .avatar-box { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .4s, filter .4s; }
  .avatar-box svg { width: auto; height: min(52vh, 600px); max-width: 100%; display: block; }
  .patient.thinking .avatar-box { transform: translateY(3px); filter: brightness(.9); }
  .patient .tag { font-size: 1.5rem; font-weight: 900; text-align: center; }
  .patient .tag small { display: block; font-size: 1rem; color: var(--muted); font-weight: 700; }
  .patient .status { min-height: 1.6em; font-size: 1.15rem; font-weight: 800; color: var(--teal); text-align: center; }
  .mode-chip { font-size: .9rem; font-weight: 800; padding: 4px 10px; border-radius: 8px; background: rgba(255,176,46,.18); color: var(--warn); }

  /* Photo portrait (4:5), crossfade between states, gentle breathing; never crops the face (object-fit: contain) */
  .portrait { position: relative; height: min(calc(100vh - 450px), 680px); aspect-ratio: 4 / 5; max-width: 100%; border-radius: 16px; overflow: hidden; background: #0b1215;
    animation: breathe 5s ease-in-out infinite; transform-origin: 50% 90%; }
  .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 250ms ease; }
  .portrait img.on { opacity: 1; }
  .portrait .ai-cap { position: absolute; left: 10px; bottom: 10px; z-index: 2; background: rgba(0,0,0,.65); color: #fff; font-size: .8rem; font-weight: 700;
    padding: 4px 10px; border-radius: 8px; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }
  @media (prefers-reduced-motion: reduce) { .portrait { animation: none; } }
  /* Voice meter under the portrait / illustration */
  .meter { display: flex; align-items: center; justify-content: center; gap: 6px; height: 34px; opacity: .25; transition: opacity .2s; }
  .meter.on { opacity: 1; }
  .meter span { width: 8px; height: 6px; border-radius: 4px; background: var(--teal); transition: height 90ms ease-out; }
  .thinking-dots { height: 34px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: var(--muted); }

  /* Avatar states (SVG) */
  .av [data-show] { display: none; }
  .av[data-state="neutral"] [data-show~="neutral"], .av[data-state="pain"] [data-show~="pain"], .av[data-state="worried"] [data-show~="worried"],
  .av[data-state="relieved"] [data-show~="relieved"] { display: inline; }
  .av .m-open { display: none; }
  .av.open [data-mouth] { display: none !important; }
  .av.open .m-open { display: inline; }

  /* Conversation: sized so that everything fits on one screen (1920x1080 and 1280x800) */
  .convo { display: flex; flex-direction: column; gap: 12px; }
  .convo-head { display: flex; align-items: center; gap: 14px; }
  .convo-head .step { flex: 1; margin: 0; }
  .transcript { background: #0b1215; border: 1px solid var(--line); border-radius: 14px; padding: 14px; height: max(150px, calc(100vh - 630px)); overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 1.3rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble .who { display: block; font-size: .85rem; font-weight: 800; color: var(--muted); margin-bottom: 2px; }
  .bubble.dentist { align-self: flex-end; background: rgba(46,196,214,.16); border: 1px solid rgba(46,196,214,.4); }
  .bubble.patient { align-self: flex-start; background: var(--panel2); border: 1px solid var(--line); }
  .bubble.thinking { color: var(--muted); font-style: italic; }
  .live-line { display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 1.15rem; font-weight: 700; }
  .heard { flex: 1; color: var(--teal); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .heard b { color: var(--muted); }
  .msg { color: var(--warn); font-weight: 700; font-size: 1.05rem; }
  .resay-btn { min-height: 48px; min-width: 48px; font-size: 1rem; font-weight: 800; border: 2px solid var(--line); border-radius: 10px;
    background: var(--panel2); color: var(--ink); padding: 0 14px; cursor: pointer; }
  .talk-btn { width: 100%; min-height: 104px; font-size: 2rem; font-weight: 900; border: 0; border-radius: 18px; cursor: pointer;
    background: var(--teal); color: #031417; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .talk-btn.listening { background: var(--listen); color: #fff; animation: pulse 1.2s infinite; }
  .talk-btn:disabled { background: #3b4f57; color: #9fb3b8; cursor: not-allowed; animation: none; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,94,.6); } 50% { box-shadow: 0 0 0 12px rgba(255,77,94,0); } }
  @media (prefers-reduced-motion: reduce) { .talk-btn.listening { animation: none; } }
  @media (max-height: 920px) { .avatar-box svg { height: 46vh; } .talk-btn { min-height: 84px; } main { padding-top: 12px; padding-bottom: 12px; } }
  .text-row { display: flex; gap: 10px; }
  .text-row input { flex: 1; min-height: 56px; font: inherit; font-size: 1.1rem; color: var(--ink); background: #0b1215; border: 2px solid #4b6670;
    border-radius: 12px; padding: 0 14px; }
  .text-row input:focus, .answer:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(46,196,214,.3); }
  .small-btn { min-height: 56px; min-width: 96px; font-size: 1.1rem; font-weight: 800; border: 2px solid var(--line); border-radius: 12px;
    background: var(--panel2); color: var(--ink); cursor: pointer; }
  .ready-btn { background: var(--gold); color: #1d1600; min-height: 64px; font-size: 1.35rem; padding: 8px 26px; }

  /* Decision */
  .question { font-size: 1.8rem; font-weight: 900; line-height: 1.3; margin: 0 0 12px; }
  .answer { width: 100%; min-height: 22vh; font: inherit; font-size: 1.4rem; line-height: 1.45; color: var(--ink); background: #0b1215;
    border: 3px solid #4b6670; border-radius: 14px; padding: 12px 14px; resize: vertical; }
  .interim { min-height: 1.6em; font-size: 1.2rem; color: var(--teal); font-weight: 700; }
  .dots span { animation: blink 1.2s infinite; } .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  .analysing-text { font-size: 2.2rem; font-weight: 900; color: var(--ai); }

  /* Feedback / outcome / result */
  .scorebar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 8px; }
  .scorebar .grow { flex: 1; }
  .scorebox { background: var(--panel2); border-radius: 16px; padding: 10px 20px; border: 2px solid var(--line); }
  .scorebox .lbl { font-size: .95rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .scorebox .val { font-size: 2.8rem; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--teal); }
  .scorebox .val small { font-size: 1.4rem; color: var(--muted); }
  .scorebox.part .val { font-size: 2rem; color: var(--ink); }
  .mode { font-size: 1rem; font-weight: 800; padding: 6px 12px; border-radius: 8px; }
  .mode.prelim { background: var(--warn); color: #241800; }
  .mode.ai { background: rgba(181,140,255,.2); color: var(--ai); }
  .flag { font-size: 1rem; font-weight: 900; padding: 6px 12px; border-radius: 8px; background: var(--bad); color: #fff; }
  .sub { font-size: .95rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 6px; }
  .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .list li { padding: 5px 12px; border-radius: 10px; background: var(--panel2); display: flex; justify-content: space-between; gap: 10px; font-size: 1.05rem; line-height: 1.3; }
  .list li.good { background: var(--ok-bg); }
  .list li.half { background: rgba(255,176,46,.15); }
  .list li.miss { background: transparent; border: 2px dashed var(--line); color: var(--muted); }
  .pts { font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .said { background: #0b1215; border-radius: 10px; padding: 10px 12px; font-size: 1.15rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .said.empty { color: var(--muted); font-style: italic; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1300px) { .two { grid-template-columns: 1fr; } }
  .outcome-text { font-size: 1.9rem; line-height: 1.6; font-weight: 700; background: var(--panel2); border-radius: 16px; padding: 18px 22px; }
  .tier { display: inline-block; font-size: 1.6rem; font-weight: 900; padding: 10px 20px; border-radius: 14px; }
  .tier.healed { background: var(--ok); color: #03200f; }
  .tier.improved { background: var(--gold); color: #1d1600; }
  .tier.complication, .tier.worse { background: var(--bad); color: #fff; }
  .tier.unclear { background: #3a4b52; color: #fff; }
  .why { font-size: 1.2rem; color: var(--ink); background: #0b1215; border-left: 5px solid var(--ok); padding: 10px 14px; border-radius: 8px; margin-top: 14px; }
  .total { font-size: 6rem; font-weight: 900; color: var(--teal); line-height: 1; font-variant-numeric: tabular-nums; }
  .total small { font-size: 2.4rem; color: var(--muted); }
  .save { font-size: 1.3rem; font-weight: 800; padding: 12px 16px; border-radius: 12px; margin: 12px 0; background: var(--panel2); }
  .save.ok { background: var(--ok-bg); color: var(--ok); }
  .save.warn { background: rgba(255,176,46,.15); color: var(--warn); }
  .save.err { background: var(--bad-bg); color: var(--bad); }
  .idle { color: var(--muted); font-size: 1.05rem; }

  /* Voice quality line (settings + voice test) */
  .voice-line { font-size: 1.05rem; }
  .q-badge { display: inline-block; font-size: .85rem; font-weight: 900; padding: 2px 8px; border-radius: 6px; margin-left: 6px; }
  .q-badge.natural { background: var(--ok); color: #03200f; }
  .q-badge.standard { background: #3a4b52; color: #fff; }
  .edge-hint { color: var(--warn); font-weight: 700; font-size: 1rem; }

  /* Settings drawer */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 92vw); background: var(--panel); border-left: 2px solid var(--line);
    z-index: 50; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: -10px 0 30px rgba(0,0,0,.5); overflow-y: auto; }
  .drawer label { font-weight: 800; }
  .drawer select { min-height: 56px; font: inherit; font-size: 1.05rem; background: #0b1215; color: var(--ink); border: 2px solid #4b6670;
    border-radius: 12px; padding: 0 10px; }
  .drawer .note { color: var(--muted); font-size: 1rem; }

  /* ?debug=1 timing overlay */
  .debug { position: fixed; left: 50%; transform: translateX(-50%); bottom: 8px; z-index: 9998; background: rgba(0,0,0,.85); color: #b7ffcf;
    font: 600 14px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 6px 12px; border-radius: 8px; border: 1px solid #2f6; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="draftBanner" class="banner" hidden>Sample cases — not yet approved by Dentistry</div>
<div id="voiceBanner" class="banner voice" hidden>Use Chrome or Edge for voice. Typing still works.</div>
<header class="topbar">
  <div class="brand">Virtual Patient<small>Booth 05 · HealthTech Experience</small></div>
  <div class="top-right">
    <div class="player" id="playerName"></div>
    <button class="tool-btn" id="langBtn" type="button" aria-label="Speech language">AR</button>
    <button class="tool-btn" id="settingsBtn" type="button" aria-expanded="false">Settings</button>
  </div>
</header>
<div class="timer" id="timerBar" aria-label="Time left" hidden>
  <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
  <div class="timer-text" id="timerText">5:00</div>
</div>
<main id="app"></main>
<aside class="drawer" id="drawer" hidden aria-label="Settings">
  <h2>Settings</h2>
  <div class="voice-line" id="voiceChosen"></div>
  <div class="edge-hint" id="edgeHint" hidden>Open this page in Microsoft Edge for free natural Arabic voices.</div>
  <label for="voiceSelect">Arabic voice</label>
  <select id="voiceSelect"></select>
  <label for="langSelect">Speech language</label>
  <select id="langSelect"><option value="ar">Arabic (ar-SA)</option><option value="en">English (en-US)</option></select>
  <button class="big-btn alt" id="drawerTest" type="button">Play sample</button>
  <p class="note" id="voiceInfo"></p>
  <button class="big-btn" id="drawerClose" type="button">Close</button>
</aside>
<div class="debug" id="debugOverlay" hidden></div>

<script src="../shared/shared.js"></script>

<!--
  Pure logic (no DOM): cases, prompts, reply guard, scripted patient, grading guard, sentence splitting, voice ranking.
  booth05/tools/test_guard.js runs this block in Node; booth05/tools/patient_guard.py mirrors it in Python.
  booth05/tools/inject_cases.py replaces the CASES block.
-->
<script id="patient-core">
/*
 * HOW TO EDIT CASES: edit booth05/data/cases.json, then
 *   python3 booth05/tools/validate_cases.py && python3 booth05/tools/inject_cases.py
 * Set "reviewStatus": "APPROVED" per case after the Dentistry sign-off ("REJECTED" hides a case).
 */

        "keywords": [

      {

        "keywords": [

function fastScripted(c, utterance, lang) {

  const r = questionRanking(c, utterance);
  const best = r[0], second = r[1] ? r[1].score : 0;
  if (best && best.score >= FAST_MIN_SCORE && best.score >= FAST_MARGIN * second) return { reply: best.q.answer, questionId: best.q.id, kind: "answer" };
  return null;
}

/** Treatment option for a free-text plan: best procedural option first; meds_only only if no procedure matched. */
function matchTreatment(c, text) {
  let best = null, bestScore = 0;
  for (const o of c.treatmentOptions) {
    if (o.tier === "meds_only") continue;
    const s = termScore(text, o.keywords);
    if (s > bestScore) { best = o; bestScore = s; }
  }
  if (best) return best;
  return c.treatmentOptions.find((o) => o.tier === "meds_only" && termScore(text, o.keywords) > 0) || null;
}

/** "en" if the toggle says English, or the visitor clearly typed/spoke English; otherwise "ar". */
function replyLang(lang, visitorText) {
  if (lang === "en") return "en";
  const t = str(visitorText);
  return !hasArabic(t) && /[a-z]{2}/i.test(t) ? "en" : "ar";
}

/** Scripted ("offline") patient. state.fallbackIdx rotates the neutral lines. -> {reply, questionId, kind} */
function scriptedReply(c, utterance, lang, state) {
  const rl = replyLang(lang, utterance);
  if (hasAnyTerm(utterance, DIAG_ASK_TERMS)) return { reply: DONT_KNOW[rl], questionId: null, kind: "dontknow" };
  const q = matchQuestion(c, utterance);
  if (q) return { reply: q.answer, questionId: q.id, kind: "answer" };
  if (hasAnyTerm(utterance, GREETING_TERMS)) return { reply: GREETING_REPLY[rl], questionId: null, kind: "greeting" };
  state = state || {};
  const i = (state.fallbackIdx || 0) % c.fallbackLines.length;
  state.fallbackIdx = (state.fallbackIdx || 0) + 1;
  return { reply: c.fallbackLines[i], questionId: null, kind: "fallback" };
}

function leakTerms(c) { return [c.diagnosis.label].concat(c.diagnosis.accept || [], c.diagnosis.hintTerms || []); }

function capWords(s, n) {
  const w = str(s).split(/\s+/).filter(Boolean);
  return w.length <= n ? w.join(" ") : w.slice(0, n).join(" ") + "…";
}

/** Guard on a model reply: strip labels/quotes, leak check (-> safe line), 35-word cap. null = unusable (use the scripted patient). */
function guardReply(c, reply, lang) {
  let r = str(reply).replace(/\s+/g, " ").trim();
  r = r.replace(/^(the patient|patient|المريضة|المريض)\s*[:：]\s*/i, "").replace(/^["“”«»']+|["“”«»']+$/g, "").trim();
  if (!r) return null;
  if (hasAnyTerm(r, leakTerms(c))) {
    if (typeof console !== "undefined") console.warn("patient reply blocked by the leak check: " + r);
    return { reply: LEAK_FALLBACK[lang === "en" ? "en" : "ar"], leaked: true, capped: false };
  }
  const capped = capWords(r, REPLY_MAX_WORDS);
  return { reply: capped, leaked: false, capped: capped !== r };
}

/** Sentence chunks for speech (split after . ! ? ؟ ، …); chunks under MIN_CHUNK_WORDS words are joined to the next. */
function splitSentences(text) {
  const pieces = (str(text).replace(/\s+/g, " ").match(/[^.!?؟،…]+[.!?؟،…]*\s*/g) || []).map((p) => p.trim()).filter(Boolean);
  const out = [];
  for (const p of pieces) {
    if (out.length && wordCount(out[out.length - 1]) < MIN_CHUNK_WORDS) out[out.length - 1] += " " + p;
    else out.push(p);
  }
  if (out.length > 1 && wordCount(out[out.length - 1]) < MIN_CHUNK_WORDS) out[out.length - 2] += " " + out.pop();
  return out;
}

/* ---------------- Prompts (byte-identical with patient_guard.py) ---------------- */

function clip(s, n) { return Array.from(str(s)).slice(0, n).join(""); }
function cleanText(s, n) { return clip(s, n).replace(TAG_RE, "[removed tag]").replace(/\s+/g, " ").trim(); }
function turnsText(turns) {
  const t = (Array.isArray(turns) ? turns : []).slice(-MAX_PROMPT_TURNS);
  if (!t.length) return "(no conversation yet)";
  return t.map((x) => (x.role === "dentist" ? "DENTIST: " : "PATIENT: ") + cleanText(x.text, TURN_MAX_CHARS)).join("\n");
}
function fill(template, vals) { return template.replace(/\{\{(CASE|LANG|TURNS|TEXT|KEY|TRANSCRIPT|DIAGNOSIS|TREATMENT)\}\}/g, (m, k) => vals[k]); }
function personaView(c) {
  const p = c.profile;
  return { name: p.nameAr, age: p.age, sex: p.sex, personality: p.personality, opener: p.opener, facts: c.facts,
    knownAnswers: c.keyQuestions.map((q) => q.answer) };
}
function keyView(c) {
  return {
    keyQuestions: c.keyQuestions.map((q) => ({ id: q.id, label: q.label })),
    diagnosis: { id: "DX", label: c.diagnosis.label, accept: c.diagnosis.accept },
    treatmentOptions: c.treatmentOptions.map((o) => ({ id: o.id, label: o.label, tier: o.tier }))
  };
}
/** System prompt for the patient (rules + persona). The conversation is sent separately as chat turns. */
function buildPatientSystem(c, lang, visitorText) {
  return fill(PATIENT_SYSTEM, { CASE: JSON.stringify(personaView(c)), LANG: LANG_TEXT[replyLang(lang, visitorText)] });
}
/** The last MAX_CHAT_TURNS turns (cleaned) + the visitor's new text. -> {turns:[{role, text}], text} */
function patientChat(turns, visitorText) {
  const t = (Array.isArray(turns) ? turns : []).filter((x) => x && (x.role === "dentist" || x.role === "patient"))
    .map((x) => ({ role: x.role, text: cleanText(x.text, TURN_MAX_CHARS) })).filter((x) => x.text).slice(-MAX_CHAT_TURNS);
  return { turns: t, text: cleanText(visitorText, TURN_MAX_CHARS) };
}
function buildGradingPrompt(c, turns, diagnosisText, treatmentText) {
  return fill(GRADING_PROMPT, { KEY: JSON.stringify(keyView(c)), TRANSCRIPT: turnsText(turns),
    DIAGNOSIS: cleanText(diagnosisText, DIAGNOSIS_MAX_CHARS), TREATMENT: cleanText(treatmentText, TREATMENT_MAX_CHARS) });
}

/* ---------------- Grading ---------------- */

function validCredit(v) { return typeof v === "number" && (v === 0 || v === 0.5 || v === 1) ? v : 0; }
/** "Q3", " q03 ", "Q3: asked about night pain" -> "Q3"; anything else -> "". */
function idOf(v, prefix) {
  if (typeof v !== "string") return "";
  const m = v.trim().toUpperCase().match(new RegExp("^" + prefix + "0*([0-9]+)(?![0-9])"));
  return m ? prefix + m[1] : "";
}
function dentistText(turns) { return (Array.isArray(turns) ? turns : []).filter((t) => t.role === "dentist").map((t) => str(t.text)).join("\n"); }

function scoreParts(c, qCredits, dxCredit, option) {
  const sum = c.keyQuestions.reduce((s, q) => s + (qCredits[q.id] || 0), 0);
  const history = Math.min(5, (5 * sum) / c.keyQuestions.length);
  const diagnosis = 3 * dxCredit;
  const treatment = 2 * (option ? TIER_CREDIT[option.tier] || 0 : 0);
  return { history: round1(history), diagnosis, treatment, recomputed: round1(Math.min(10, history + diagnosis + treatment)) };
}

function finishGrade(c, input, mode, qCredits, dxCredit, option, optionSource, total, extra) {
  const tx = str(input.treatmentText).trim();
  const parts = scoreParts(c, qCredits, dxCredit, option);
  const injection = looksLikeInjection(dentistText(input.turns) + "\n" + str(input.diagnosisText) + "\n" + tx) || !!(extra && extra.modelInjection);
  if (total == null) total = parts.recomputed;
  if (injection && total > INJECTION_CAP) total = INJECTION_CAP;
  const outcome = option ? { outcomeTier: option.outcomeTier, outcome: option.outcome, why: option.why } : c.unmatchedOutcome;
  return {
    mode, total, history: parts.history, diagnosis: parts.diagnosis, treatment: parts.treatment,
    questions: c.keyQuestions.map((q) => ({ id: q.id, label: q.label, credit: qCredits[q.id] || 0 })),
    dxCredit, option: option ? { id: option.id, label: option.label, tier: option.tier } : null, optionSource,
    outcome, needsSupervisor: !option && !!tx, injectionSuspected: injection, overridden: !!(extra && extra.overridden)
  };
}

/** LOCAL keyword grading ("Preliminary grading"). Always returns a result. */
function localGrade(c, input) {
  const qCredits = {};
  for (const t of (Array.isArray(input.turns) ? input.turns : []).filter((x) => x.role === "dentist")) {
    for (const q of questionsHit(c, t.text)) qCredits[q.id] = 1;
  }
  const dxCredit = hasAnyTerm(input.diagnosisText, c.diagnosis.accept) ? 1 : 0;
  const tx = str(input.treatmentText).trim();
  const option = tx ? matchTreatment(c, tx) : null;
  return finishGrade(c, input, "local", qCredits, dxCredit, option, option ? "keywords" : null, null);
}

/** Guard on the model's JSON. Returns a safe result, or null if unusable (caller falls back to localGrade). */
function guardGrade(c, input, result) {
  if (!result || typeof result !== "object" || Array.isArray(result) || result.mock) return null;
  const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);
  if (!Array.isArray(result.questionsAsked) && !isObj(result.diagnosis) && !isObj(result.treatment)) return null;
  const ids = new Set(c.keyQuestions.map((q) => q.id));
  const qCredits = {};
  if (dentistText(input.turns).trim()) {
    const seen = new Set();
    for (const v of Array.isArray(result.questionsAsked) ? result.questionsAsked : []) {
      if (!isObj(v)) continue;
      const id = idOf(v.id, "Q");
      if (!ids.has(id) || seen.has(id)) continue; // unknown ids ignored; first entry wins
      seen.add(id);
      qCredits[id] = validCredit(v.credit);
    }
  }
  const dxCredit = str(input.diagnosisText).trim() && isObj(result.diagnosis) ? validCredit(result.diagnosis.credit) : 0;
  const tx = str(input.treatmentText).trim();
  let option = null, optionSource = null;
  if (tx) {
    const oid = isObj(result.treatment) ? idOf(result.treatment.optionId, "T") : "";
    option = c.treatmentOptions.find((o) => o.id === oid) || null; // Gemini's treatment credit is ignored: the tier decides
    if (option) optionSource = "ai";
    else { option = matchTreatment(c, tx); optionSource = option ? "keywords" : null; }
  }
  const parts = scoreParts(c, qCredits, dxCredit, option);
  let total = parts.recomputed, overridden = false;
  if (result.total !== undefined && result.total !== null) {
    const t = typeof result.total === "number" ? result.total : NaN;
    if (isFinite(t) && t >= 0 && t <= 10 && Math.abs(t - parts.recomputed) <= SCORE_TOLERANCE) total = round1(t);
    else {
      overridden = true;
      if (typeof console !== "undefined") console.warn("grade guard: model total " + result.total + " replaced by recomputed " + parts.recomputed);
    }
  }
  return finishGrade(c, input, "ai", qCredits, dxCredit, option, optionSource, total, { overridden, modelInjection: result.injectionSuspected === true });
}

function gradeFromModel(c, input, result) { return guardGrade(c, input, result) || localGrade(c, input); }

/** Case for the next visitor: ?case= wins; otherwise random, avoiding the previous visitor's case. */
function pickCase(cases, lastId, forcedId, rand) {
  rand = rand || Math.random;
  if (forcedId) { const f = cases.find((c) => c.id === forcedId); if (f) return f; }
  const pool = cases.length > 1 ? cases.filter((c) => c.id !== lastId) : cases;
  return pool.length ? pool[Math.floor(rand() * pool.length)] : null;
}

/* ---------------- Voices ---------------- */

const VOICE_QUALITY_RE = /natural|neural|online|premium|enhanced/i;
const VOICE_KNOWN_RE = /hamed|zariyah|majed|tarik|laila|maged/i;
function voiceQuality(v) { return v && VOICE_QUALITY_RE.test(v.name || "") ? "Natural" : "Standard"; }
/**
 * Voices for a language, best first. Arabic: ar-SA natural, any ar natural, known good names, ar-SA, any ar.
 * English: en-US natural, any en natural, en-US, any en. Empty list -> the browser default voice.
 */
function rankVoices(voices, lang) {
  const pre = lang === "en" ? "en" : "ar", main = lang === "en" ? "US" : "SA";
  const isLang = (v) => new RegExp("^" + pre + "([-_]|$)", "i").test(v.lang || "");
  const isMain = (v) => new RegExp("^" + pre + "[-_]" + main + "$", "i").test(v.lang || "");
  const rank = (v) => {
    const q = VOICE_QUALITY_RE.test(v.name || "");
    if (isMain(v) && q) return 0;
    if (q) return 1;
    if (pre === "ar" && VOICE_KNOWN_RE.test(v.name || "")) return 2;
    if (isMain(v)) return 3;
    return 4;
  };
  return (voices || []).filter(isLang).map((v, i) => ({ v, i, r: rank(v) })).sort((a, b) => a.r - b.r || a.i - b.i).map((x) => x.v);
}

const OUTCOME_LABEL = { healed: "Healed", improved: "Partly improved", complication: "Complication", worse: "Got worse", unclear: "Unclear — supervisor check" };
const OUTCOME_STATE = { healed: "relieved", improved: "neutral", complication: "pain", worse: "pain", unclear: "worried" };

function fmtNum(x) { return String(round1(x)); }
/** Short spoken tutor summary (pre-written templates, never AI text). */
function tutorSummary(g, lang) {
  const asked = g.questions.filter((q) => q.credit > 0).length, n = g.questions.length;
  const tier = g.option ? g.option.tier : null;
  if (lang === "en") {
    return "You asked " + asked + " of " + n + " key questions. " +
      (g.dxCredit === 1 ? "Your diagnosis is correct. " : g.dxCredit === 0.5 ? "Your diagnosis is partly correct. " : "Your diagnosis does not match. ") +
      (tier === "correct" ? "Your treatment plan is appropriate. " : tier === "partial" ? "Your treatment plan is partly appropriate. " : tier ? "Your treatment plan is not appropriate. " : "I could not match your treatment plan. ") +
      "Your score is " + fmtNum(g.total) + " out of 10.";
  }
  return "سألت " + asked + " من " + n + " أسئلة مهمة. " +
    (g.dxCredit === 1 ? "التشخيص صحيح. " : g.dxCredit === 0.5 ? "التشخيص صحيح جزئياً. " : "التشخيص غير صحيح. ") +
    (tier === "correct" ? "خطة العلاج مناسبة. " : tier === "partial" ? "خطة العلاج مناسبة جزئياً. " : tier ? "خطة العلاج غير مناسبة. " : "ما قدرت أحدد خطة العلاج. ") +
    "درجتك " + fmtNum(g.total) + " من عشرة.";
}

if (typeof module !== "undefined") {
  module.exports = { CASES, PATIENT_SYSTEM, GRADING_PROMPT, INJECTION_SRC, TIER_CREDIT, LEAK_FALLBACK, DONT_KNOW, FILLERS, MAX_CHAT_TURNS,
    FAST_MIN_SCORE, FAST_MARGIN, normalize, termIn, hasAnyTerm, termScore, looksLikeInjection, questionRanking, matchQuestion, questionsHit,
    asksSeverity, fastScripted, matchTreatment, replyLang, scriptedReply, leakTerms, capWords, guardReply, splitSentences, turnsText,
    buildPatientSystem, patientChat, buildGradingPrompt, idOf, localGrade, guardGrade, gradeFromModel, pickCase, round1, tutorSummary,
    voiceQuality, rankVoices, OUTCOME_LABEL, OUTCOME_STATE };
}
</script>

  const MIN_ANALYSE_MS = 2500;

  /** {voice, name, quality, auto} for a language: the saved choice (Arabic) or the best ranked voice. */
  function voiceFor(l) {
    const vs = V.voices;
    if (l === "ar") {

      const sv = saved && vs.find((v) => v.name === saved);
      if (sv) return { voice: sv, name: sv.name, quality: voiceQuality(sv), auto: false };
    }
    const best = rankVoices(vs, l)[0] || null;

  function voiceLine() {

  function refreshVoiceUi() {

  function loadVoices() {

      (ar ? "" : " Install an Arabic voice in the OS language settings, or use Microsoft Edge.");

  if (TTS) { loadVoices(); if (TTS.addEventListener) TTS.addEventListener("voiceschanged", loadVoices); else TTS.onvoiceschanged = loadVoices; }
  else document.getElementById("voiceInfo").textContent = "This browser has no speech output; the patient's words are shown as text.";

  /** Premium voice (USE_GEMINI_TTS): plays chunks through the backend; prefetches the next chunk. -> index of the first chunk NOT spoken */
  async function speakViaBackend(chunks, l, token, hooks) {
    let next = ttsSpeak(chunks[0], l);
    for (let i = 0; i < chunks.length; i++) {
      let r;
      try { r = await next; } catch (err) { console.warn("ttsSpeak failed, browser voice takes over:", err && err.message); return i; }
      if (token !== V.speakToken) return chunks.length;
      next = i + 1 < chunks.length ? ttsSpeak(chunks[i + 1], l) : null;
      if (next) next.catch(() => {});
      const ok = await new Promise((resolve) => {
        const a = new Audio("data:" + (r.mimeType || "audio/wav") + ";base64," + r.audio);
        V.audio = a;
        let started = false;
        a.onplaying = () => { if (!started) { started = true; hooks.onStart(); } };
        a.onended = () => resolve(true);
        a.onerror = () => resolve(started);
        a.play().catch(() => resolve(false));
      });
      V.audio = null;
      if (!ok) return i;
      if (token !== V.speakToken) return chunks.length;
    }
    return chunks.length;
  }

  /** One browser utterance; resolves at the end (or after a safety timeout: some browsers never fire onend). */
  function speakOne(text, l, avatar, hooks) {
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(text);
      const vf = voiceFor(l);
      u.lang = l === "en" ? "en-US" : "ar-SA";
      if (vf.voice) u.voice = vf.voice;
      u.rate = vf.quality === "Natural" ? 1.0 : 0.92;
      u.pitch = 1.0;
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      u.onstart = () => hooks.onStart();
      u.onend = finish;
      u.onerror = finish;
      u.onboundary = () => { if (avatar) avatar.boundary(); };
      setTimeout(finish, Math.min(15000, 1200 + wordCount(text) * 520));
      TTS.speak(u);
    });
  }

  /** Speak text sentence by sentence (audio starts after the first sentence). opts.onStart fires once, at the first sound. */
  async function speak(text, l, avatar, opts) {
    opts = opts || {};
    stopListening();
    stopSpeaking();
    const token = V.speakToken;
    const chunks = splitSentences(text);
    if (!chunks.length) return;
    let startedOnce = false;
    const hooks = { onStart: () => { if (!startedOnce) { startedOnce = true; if (opts.onStart) opts.onStart(); } } };
    V.speaking = true;
    if (avatar) avatar.speaking(true);
    try {
      let from = 0;
      if (USE_GEMINI_TTS) from = await speakViaBackend(chunks, l, token, hooks);
      if (!TTS) { hooks.onStart(); await sleep(Math.min(3500, 600 + wordCount(text) * 120)); return; }
      for (let i = from; i < chunks.length; i++) {
        if (token !== V.speakToken) return;
        await speakOne(chunks[i], l, avatar, hooks);
      }
    } finally {
      if (token === V.speakToken) {
        V.speaking = false;
        if (avatar) avatar.speaking(false);
      }
    }
  }
  function stopSpeaking() {
    V.speakToken++;
    V.speaking = false;
    if (TTS) TTS.cancel();
    if (V.audio) { try { V.audio.pause(); } catch (e) { /* ignore */ } V.audio = null; }
  }

  /** One utterance per call. handlers: {onInterim(text), onFinal(text), onError(code), onEnd()} */
  function listen(l, handlers) {
    if (!SR) { handlers.onError && handlers.onError("unsupported"); return false; }
    stopSpeaking();
    stopListening();
    const rec = new SR();
    rec.lang = l === "en" ? "en-US" : "ar-SA";
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    let finalText = "";
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      handlers.onInterim && handlers.onInterim((finalText + " " + interim).trim());
    };
    rec.onerror = (e) => { handlers.onError && handlers.onError(e.error || "error"); };
    rec.onend = () => {
      if (V.rec === rec) { V.rec = null; V.listening = false; }
      const t = finalText.trim();
      if (t) handlers.onFinal && handlers.onFinal(t);
      handlers.onEnd && handlers.onEnd();
    };
    V.rec = rec;
    V.listening = true;
    try { rec.start(); } catch (err) { V.rec = null; V.listening = false; handlers.onError && handlers.onError("start-failed"); return false; }
    return true;
  }
  function stopListening(abort) {
    const r = V.rec;
    if (!r) return;
    try { abort ? r.abort() : r.stop(); } catch (e) { /* already stopped */ }
    if (abort) { V.rec = null; V.listening = false; }
  }
  const MIC_ERRORS = {
    "not-allowed": "Microphone blocked: allow mic access for this page (needs https or localhost).",
    "service-not-allowed": "Speech recognition is blocked in this browser. Use Chrome or Edge, or type.",
    "no-speech": "Didn't catch that. Tap and speak again, or type.",
    "audio-capture": "No microphone found. Check the headset connection.",
    "network": "Speech recognition needs internet. Type instead.",
    "unsupported": "Voice input is not available in this browser. Type instead.",
    "start-failed": "Could not start the microphone. Try again."

  /* ================= Avatar: photo portrait (if all files exist) or SVG illustration ================= */
  const photoCache = new Map(); // caseId -> Promise<boolean>

    const a = c.profile.avatar;
    return typeof a === "string" ? { type: "svg", svg: a } : a;
  }
  /** true when every state image of the case loads (else the SVG is used, silently). */
  function probePhotos(c) {
    const a = avatarSpec(c);
    if (FORCE_SVG || a.type !== "photo") return Promise.resolve(false);
    if (!photoCache.has(c.id)) {
      const one = (st) => new Promise((resolve) => {
        const img = new Image();
        const t = setTimeout(() => resolve(false), PHOTO_PROBE_MS);
        img.onload = () => { clearTimeout(t); resolve(img.naturalWidth > 0); };
        img.onerror = () => { clearTimeout(t); resolve(false); };
        img.src = a.dir + "/" + st + ".jpg";

      photoCache.set(c.id, Promise.all(a.states.map(one)).then((r) => r.every(Boolean)));

  function makeMeter() {
    const meter = h("div", { class: "meter", "aria-hidden": "true" });
    const bars = Array.from({ length: 9 }, () => h("span"));
    bars.forEach((b) => meter.appendChild(b));
    let timer = null, level = 0, lastBoundary = 0;
    const draw = () => {
      const t = now() / 1000;
      const boost = now() - lastBoundary < 160 ? 1 : 0.55; // boundary events push the level up; otherwise a gentle envelope
      level = level * 0.6 + (0.35 + 0.65 * Math.abs(Math.sin(t * 7.3)) * boost) * 0.4;
      bars.forEach((b, i) => { b.style.height = Math.max(6, Math.round(30 * level * (0.5 + 0.5 * Math.abs(Math.sin(t * 5 + i * 0.9))))) + "px"; });
    };
    return {
      el: meter,
      on(v) { meter.classList.toggle("on", v); clearInterval(timer); if (v) timer = setInterval(draw, 80); else bars.forEach((b) => { b.style.height = "6px"; }); },
      bump() { lastBoundary = now(); }
    };
  }

  function makeAvatar(c, usePhoto) {
    const spec = avatarSpec(c);
    const box = h("div", { class: "avatar-box" + (usePhoto ? " photo" : " svg"), "data-kind": usePhoto ? "photo" : "svg" });
    const meter = makeMeter();
    const thinkingDots = h("div", { class: "thinking-dots", hidden: true }, h("span", { class: "dots" }, h("span", { text: "." }), h("span", { text: "." }), h("span", { text: "." })));

    if (usePhoto) {
      const portrait = h("div", { class: "portrait" });
      const imgs = {};

        imgs[st] = h("img", { src: spec.dir + "/" + st + ".jpg", alt: "", "data-state": st, draggable: "false" });
        portrait.appendChild(imgs[st]);

    setMood(mood);
    const api = {
      el: box,
      kind: usePhoto ? "photo" : "svg",
      setState(st) {

        mood = st; setMood(st);
      },
      speaking(on) {

        svg.classList.add("open");
        setTimeout(() => svg.classList.remove("open"), 140);

      thinking(on) {
        thinkingDots.hidden = !on;
        meter.el.hidden = on;
        const panel = box.closest(".patient");
        if (panel) panel.classList.toggle("thinking", on);
      },
      mood() { return mood; }
    };
    return api;
  }

  /* ================= Timer ================= */
  function drawTimer(left) {
    timerFill.style.width = clamp((left / TIME_LIMIT_S) * 100, 0, 100) + "%";

  /* ================= Idle reset ================= */
  let idle = null;

  async function onReady(player) {

  /* ---------- 1. Start screen (voice test) ---------- */

    const testBtn = h("button", { class: "big-btn alt", id: "voiceTestBtn", type: "button" }, "Voice test");
    testBtn.addEventListener("click", async () => {
      testBtn.disabled = true;
      heard.className = "said";

      h("section", { class: "card" },
        h("div", { class: "step", text: "Your patient" }),
        h("h2", { text: "You are the dentist. Find out what is wrong." }),
        h("p", { class: "hint", text: "Headset on. Tap the big button, ask one question, then tap again (or pause). The patient answers only what you ask. You have 5 minutes, then you give your diagnosis and treatment plan." }),
        h("p", { class: "hint", text: "Patient speech: " + (lang === "en" ? "English" : "Saudi Arabic") + " (AR/EN button at the top)." }),
        h("div", { class: "sub", text: "Supervisor: voice check" }),
        h("div", { class: "voice-line", id: "voiceTestVoice" }),
        h("div", { class: "edge-hint", id: "voiceTestHint", hidden: true, text: "Open this page in Microsoft Edge for free natural Arabic voices." }),
        heard,
        h("div", { class: "row-actions" }, testBtn, h("span", { class: "grow" }), startBtn)
      )));
    refreshVoiceUi();
  }

  /* ---------- 2. Consultation ---------- */
  function showConsult() {
    const c = S.c;
    const token = ++S.token;
    stopListening(true);
    stopSpeaking();
    app.textContent = "";
    const avatar = makeAvatar(c, S.photo);
    S.avatar = avatar;
    const base = c.profile.baseState || "neutral";
    const panel = patientPanel(c, avatar, "");
    const transcript = h("div", { class: "transcript", id: "transcript", "aria-live": "polite" });
    const heard = h("div", { class: "heard", id: "heardLine", dir: "auto" });
    const msg = h("div", { class: "msg", id: "consultMsg", role: "status" });
    const resay = h("button", { class: "resay-btn", id: "resayBtn", type: "button", hidden: true, title: "Remove your last question and say it again" }, "↺ Tap to re-say");
    const talk = h("button", { class: "talk-btn", id: "talkBtn", type: "button" });
    const input = h("input", { id: "textInput", type: "text", dir: "auto", maxlength: String(TURN_MAX_CHARS), autocomplete: "off",
      placeholder: "Or type your question here", "aria-label": "Type a question" });
    const send = h("button", { class: "small-btn", id: "sendBtn", type: "button" }, "Send");
    const ready = h("button", { class: "big-btn ready-btn", id: "readyBtn", type: "button", title: "Done asking? Give your diagnosis and plan." }, "I'm ready →");
    const modeChip = h("span", { class: "mode-chip", id: "offlineChip", text: "Offline patient", hidden: !S.aiDown });

    function setHeard(t) {
      heard.textContent = "";
      if (t) heard.append(h("b", { text: "Heard: " }), t);
    }
    function renderTranscript() {
      transcript.textContent = "";
      for (const t of S.turns) {
        transcript.appendChild(h("div", { class: "bubble " + t.role, dir: "auto", "data-source": t.source || "" },
          h("span", { class: "who", text: t.role === "dentist" ? "You" : c.profile.name }), t.text));
      }
      transcript.scrollTop = transcript.scrollHeight;
    }
    function refresh() {
      const live = token === S.token;
      if (!SR) { talk.disabled = true; talk.textContent = "🎤 Voice not available"; }
      else if (V.listening) { talk.disabled = false; talk.className = "talk-btn listening"; talk.textContent = "● Listening… tap to stop"; }
      else if (S.busy) { talk.disabled = true; talk.className = "talk-btn"; talk.textContent = "Patient is thinking…"; }
      else if (V.speaking) { talk.disabled = !live; talk.className = "talk-btn"; talk.textContent = "🎤 Tap to talk (interrupts)"; }
      else { talk.disabled = !live; talk.className = "talk-btn"; talk.textContent = "🎤 Tap to talk"; }
      send.disabled = S.busy;
      resay.hidden = !(SR && S.lastVoiceTurn != null && !S.busy && !V.listening && S.turns.length);
      modeChip.hidden = !S.aiDown;
      panel.status.textContent = V.speaking ? "Speaking…" : S.busy ? "Thinking…" : V.listening ? "Listening to you…" : "";
    }

    async function patientSays(text, source, mark) {
      if (token !== S.token) return;
      S.turns.push({ role: "patient", text, source });
      renderTranscript();
      const p = speak(text, S.lang, avatar, { onStart: () => { if (mark) { mark.tts = now(); showMark(mark); } } });
      refresh();
      await p;
      if (token === S.token) avatar.setState(base);
      refresh();
    }

    /** -> {text, source: "fast" | "ai" | "scripted" | "leak", model} */
    async function getReply(text, mark) {
      if (FAST_SCRIPTED_FIRST) {
        const f = fastScripted(c, text, S.lang);
        if (f) { mark.path = "scripted (fast)"; return { text: f.reply, source: "fast" }; }
      }
      const prior = S.turns.slice(0, -1); // the visitor's new text is sent separately
      if (!S.aiDown && S.aiTurns < MAX_AI_TURNS) {
        S.aiTurns++;
        try {
          const chat = patientChat(prior, text);
          mark.sent = now();
          const r = await patientTurn({ caseId: c.id, lang: replyLang(S.lang, text), system: buildPatientSystem(c, S.lang, text),
            turns: chat.turns, text: chat.text, leakTerms: leakTerms(c) });
          mark.recv = now();
          mark.model = r && r.model;
          const g = guardReply(c, r && r.reply, replyLang(S.lang, text));
          if (g) { S.aiFails = 0; mark.path = g.leaked ? "ai (leak blocked)" : "ai"; return { text: g.reply, source: g.leaked || (r && r.leaked) ? "leak" : "ai" }; }
          throw new Error("empty reply");
        } catch (err) {
          if (mark.recv == null && mark.sent != null) mark.recv = now();
          console.warn("patientTurn failed, scripted patient answers:", err && err.message);
          S.aiFails++;
          if (S.aiFails >= AI_FAILS_BEFORE_SCRIPTED) S.aiDown = true;
        }
      }
      S.usedScripted = true;
      mark.path = "scripted (fallback)";
      return { text: scriptedReply(c, text, S.lang, S.scripted).reply, source: "scripted" };
    }

    async function dentistSays(text, mark, byVoice) {
      text = String(text || "").replace(/\s+/g, " ").trim().slice(0, TURN_MAX_CHARS);
      if (token !== S.token || S.busy) return;
      if (text.length < 2) { msg.textContent = "Too short — ask a full question."; return; }
      mark = mark || newMark("typed");
      msg.textContent = "";
      S.turns.push({ role: "dentist", text, source: byVoice ? "voice" : "typed" });
      S.lastVoiceTurn = byVoice ? S.turns.length - 1 : null;
      renderTranscript();
      S.busy = true;
      if (asksSeverity(text)) avatar.setState("worried");
      avatar.thinking(true);
      refresh();
      const thinking = h("div", { class: "bubble patient thinking", id: "thinkingBubble" },
        h("span", { class: "dots" }, h("span", { text: "." }), h("span", { text: "." }), h("span", { text: "." })));
      transcript.appendChild(thinking);
      transcript.scrollTop = transcript.scrollHeight;
      // Instant acknowledgement: a short pre-written filler if the wait is longer than FILLER_AFTER_MS.
      let replied = false;
      const fillerTimer = setTimeout(() => {
        if (replied || token !== S.token) return;
        const list = FILLERS[replyLang(S.lang, text)];
        S.fillers = (S.fillers || 0) + 1;
        speak(list[(S.fillers - 1) % list.length], S.lang, avatar);
      }, FILLER_AFTER_MS);
      const reply = await getReply(text, mark);
      replied = true;
      clearTimeout(fillerTimer);
      thinking.remove();
      avatar.thinking(false);
      S.busy = false;
      if (token !== S.token) return;
      await patientSays(reply.text, reply.source, mark);
    }

    function startListening() {
      if (token !== S.token || S.busy) return;
      msg.textContent = "";
      setHeard("");
      const ok = listen(S.lang, {
        onInterim: (t) => setHeard(t),
        onFinal: (t) => {
          if (t.trim().length < 2) { msg.textContent = MIC_ERRORS["no-speech"]; return; }
          const m = newMark("voice");
          setHeard(t);
          dentistSays(t, m, true);
        },
        onError: (code) => { if (code !== "aborted") msg.textContent = MIC_ERRORS[code] || "Microphone error: " + code; },
        onEnd: () => refresh()
      });
      if (ok) avatar.speaking(false);
      refresh();
    }

    talk.addEventListener("click", () => {
      if (token !== S.token) return;
      if (V.listening) { stopListening(); return; }
      if (S.busy) return;
      startListening();
    });
    resay.addEventListener("click", () => {
      if (token !== S.token || S.busy || S.lastVoiceTurn == null) return;
      stopSpeaking();
      S.turns = S.turns.slice(0, S.lastVoiceTurn); // drop the last question and the patient's answer to it
      S.lastVoiceTurn = null;
      renderTranscript();
      startListening();
    });
    const sendTyped = () => { const t = input.value; if (S.busy) return; input.value = ""; dentistSays(t, newMark("typed"), false); };
    send.addEventListener("click", sendTyped);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendTyped(); } });
    let finished = false;
    const finish = () => {
      if (finished || token !== S.token) return;
      finished = true;
      S.endedAt = Date.now();
      stopTimer();
      stopListening(true);
      stopSpeaking();
      showDecision();
    };
    ready.addEventListener("click", finish);

    app.appendChild(h("div", { class: "stage" }, panel.el,
      h("section", { class: "card convo" },
        h("div", { class: "convo-head" }, h("div", { class: "step", text: "Consultation — ask your questions" }), modeChip, ready),
        transcript,
        h("div", { class: "live-line" }, heard, msg, resay),
        talk,
        h("div", { class: "text-row" }, input, send)
      )));
    refresh();
    const ticker = setInterval(() => { if (token !== S.token) clearInterval(ticker); else refresh(); }, 400);
    S.startedAt = Date.now();
    startTimer(finish);
    avatar.setState("pain"); // the opener is said in pain
    patientSays(c.profile.opener, "opener", null);
  }

  /* ---------- 3. Decision: diagnosis, then treatment ---------- */
  function showDecision() {
    const c = S.c;
    const token = ++S.token;
    app.textContent = "";
    const avatar = makeAvatar(c, S.photo);
    const panel = patientPanel(c, avatar, "Waiting for your decision");
    const steps = [
      { key: "diagnosisText", step: "Step 1 of 2", q: "What is your diagnosis?", ph: "Your diagnosis (English or Arabic)", next: "Next" },
      { key: "treatmentText", step: "Step 2 of 2", q: "What is your treatment plan?", ph: "Your treatment plan (English or Arabic)", next: "Submit" }
    ];
    let i = 0;
    const box = h("section", { class: "card convo" });
    app.appendChild(h("div", { class: "stage" }, panel.el, box));
    // Walk-away guard: if nobody touches the screen for a while, submit what is there.
    startIdle(DECISION_IDLE_S, () => { if (token === S.token) { saveField(); submitAll(); } });
    let ta = null;
    const saveField = () => { if (ta) S[steps[i].key] = ta.value.trim(); };

    function render() {
      const st = steps[i];
      box.textContent = "";
      ta = h("textarea", { class: "answer", id: i === 0 ? "diagnosisInput" : "treatmentInput", dir: "auto", maxlength: String(i === 0 ? DIAGNOSIS_MAX_CHARS : TREATMENT_MAX_CHARS),
        placeholder: st.ph, "aria-label": st.q });
      ta.value = S[st.key] || "";
      const msg = h("div", { class: "msg", role: "status" });
      const interim = h("div", { class: "interim", dir: "auto" });
      const talk = h("button", { class: "talk-btn", type: "button", id: "decisionTalk", disabled: !SR }, SR ? "🎤 Tap to talk" : "🎤 Voice not available");
      talk.addEventListener("click", () => {
        if (V.listening) { stopListening(); return; }
        msg.textContent = "";
        talk.className = "talk-btn listening"; talk.textContent = "● Listening… tap to stop";
        listen(S.lang, {
          onInterim: (t) => { interim.textContent = "Heard: " + t; },
          onFinal: (t) => { if (t.trim().length >= 2) ta.value = (ta.value.trim() + " " + t.trim()).trim(); },
          onError: (code) => { if (code !== "aborted") msg.textContent = MIC_ERRORS[code] || "Microphone error: " + code; },
          onEnd: () => { interim.textContent = ""; talk.className = "talk-btn"; talk.textContent = "🎤 Tap to talk"; }
        });
      });
      const next = h("button", { class: "big-btn", type: "button", id: i === 0 ? "nextStepBtn" : "submitBtn" }, st.next);
      next.addEventListener("click", () => {
        if (token !== S.token) return;
        stopListening(true);
        saveField();
        if (!S[st.key]) { msg.textContent = "Say or type your answer first."; return; }
        if (i === 0) { i = 1; render(); } else submitAll();
      });
      box.append(h("div", { class: "step", text: st.step }), h("p", { class: "question", text: st.q }), talk, interim, ta, msg,
        h("div", { class: "row-actions" }, h("span", { class: "grow" }), next));
      setTimeout(() => ta.focus(), 0);
    }
    render();

    let submitted = false;
    function submitAll() {
      if (submitted || token !== S.token) return;
      submitted = true;
      stopIdle();
      stopListening(true);
      gradeNow();
    }
  }

  /* ---------- 4. Grading + tutor feedback ---------- */
  async function gradeNow() {
    const c = S.c;
    const token = ++S.token;
    app.textContent = "";
    app.appendChild(h("div", { class: "card", id: "analysing", style: "max-width:1100px;margin:6vh auto" },
      h("div", { class: "analysing-text" }, "The clinical tutor is reviewing your consultation",
        h("span", { class: "dots" }, h("span", { text: "." }), h("span", { text: "." }), h("span", { text: "." }))),
      h("p", { class: "hint", text: "Checking your history questions, diagnosis and treatment plan." })));
    const input = { turns: S.turns, diagnosisText: S.diagnosisText, treatmentText: S.treatmentText };
    let result = null;
    if (!HT_MOCK) {
      const call = patientGrade({ caseId: c.id, prompt: buildGradingPrompt(c, S.turns, S.diagnosisText, S.treatmentText) })
        .then((r) => r, (err) => { console.warn("patientGrade failed, using preliminary keyword grading:", err && err.message); return null; });
      [result] = await Promise.all([call, sleep(MIN_ANALYSE_MS)]);
    } else await sleep(MIN_ANALYSE_MS);
    if (!S || token !== S.token) return;
    S.grade = gradeFromModel(c, input, result);
    save();
    showFeedback();
  }

  function startResultIdle(tick) {
    startIdle(IDLE_RESET_S, checkIn, tick);
  }

  function showFeedback() {
    const c = S.c, g = S.grade;
    ++S.token;
    app.textContent = "";
    const avatar = makeAvatar(c, S.photo);
    avatar.setState("neutral");
    const panel = patientPanel(c, avatar, "");
    panel.el.querySelector(".tag").firstChild.textContent = "Clinical tutor";
    const prelim = g.mode !== "ai";
    const qItem = (q) => h("li", { class: q.credit === 1 ? "good" : q.credit === 0.5 ? "half" : "miss" },
      h("span", { text: (q.credit === 1 ? "✓ " : q.credit === 0.5 ? "½ " : "✗ ") + q.label }),
      h("span", { class: "pts", text: q.credit === 1 ? "asked" : q.credit === 0.5 ? "partly" : "missed" }));
    const said = (t) => h("div", { class: "said" + (t ? "" : " empty"), dir: "auto", text: t || "(nothing)" });
    const tierText = { correct: "correct plan", partial: "partly right", common_wrong: "common mistake", meds_only: "medicines only" };
    const nextBtn = h("button", { class: "big-btn", id: "toOutcomeBtn", type: "button", onclick: () => showOutcome() }, "After 7 days… →");
    app.appendChild(h("div", { class: "stage" }, panel.el,
      h("section", { class: "card", id: "feedback" },
        h("div", { class: "scorebar" },
          h("div", { class: "scorebox" }, h("div", { class: "lbl", text: "Score" }), h("div", { class: "val", id: "totalScore" }, fmtNum(g.total), h("small", { text: " / 10" }))),
          h("div", { class: "scorebox part" }, h("div", { class: "lbl", text: "History" }), h("div", { class: "val", text: fmtNum(g.history) + " / 5" })),
          h("div", { class: "scorebox part" }, h("div", { class: "lbl", text: "Diagnosis" }), h("div", { class: "val", text: fmtNum(g.diagnosis) + " / 3" })),
          h("div", { class: "scorebox part" }, h("div", { class: "lbl", text: "Treatment" }), h("div", { class: "val", text: fmtNum(g.treatment) + " / 2" })),
          h("span", { class: "mode " + (prelim ? "prelim" : "ai"), id: "gradingMode", text: prelim ? "Preliminary grading" : "Graded by AI against the key" }),
          g.needsSupervisor ? h("span", { class: "flag", id: "supervisorFlag", text: "Supervisor: please review the treatment plan" }) : null,
          g.injectionSuspected ? h("span", { class: "flag", text: "Score capped at 3: instructions to the grader detected" }) : null,
          h("span", { class: "grow" }), nextBtn),
        h("div", { class: "two" },
          h("div", {}, h("div", { class: "sub", text: "Key history questions" }), h("ul", { class: "list", id: "questionList" }, g.questions.map(qItem))),
          h("div", {},
            h("div", { class: "sub", text: "Your diagnosis" }), said(S.diagnosisText),
            h("div", { class: "sub", text: "Expected diagnosis" }), h("div", { class: "said", text: c.diagnosis.label + (g.dxCredit === 1 ? "  ✓" : g.dxCredit === 0.5 ? "  (partly)" : "  ✗") }),
            h("div", { class: "sub", text: "Your treatment plan" }), said(S.treatmentText),
            h("div", { class: "sub", text: "Matched plan" }),
            h("div", { class: "said", id: "matchedPlan", text: g.option ? g.option.label + " — " + tierText[g.option.tier] : "No matching plan" }))))));
    startResultIdle(null);
    speak(tutorSummary(g, S.lang), S.lang, avatar);
  }

  /* ---------- 5. After 7 days ---------- */
  function showOutcome() {
    const c = S.c, g = S.grade, o = g.outcome;
    ++S.token;
    stopSpeaking();
    app.textContent = "";
    const avatar = makeAvatar(c, S.photo);
    avatar.setState(OUTCOME_STATE[o.outcomeTier] || "neutral");
    const panel = patientPanel(c, avatar, "7 days later");
    app.appendChild(h("div", { class: "stage" }, panel.el,
      h("section", { class: "card", id: "outcome" },
        h("div", { class: "step", text: "After 7 days…" }),
        h("h2", { text: c.profile.name + " comes back" }),
        h("div", { class: "outcome-text", id: "outcomeText", dir: "rtl", lang: "ar", text: o.outcome }),
        h("div", { class: "row-actions" }, h("span", { class: "tier " + o.outcomeTier, id: "outcomeTier", text: OUTCOME_LABEL[o.outcomeTier] || o.outcomeTier })),
        h("div", { class: "why", id: "outcomeWhy", text: "Why: " + o.why }),
        h("div", { class: "row-actions" }, h("span", { class: "grow" }), h("button", { class: "big-btn", id: "toResultBtn", type: "button", onclick: () => showResult() }, "See result")))));
    startResultIdle(null);
    speak(o.outcome, "ar", avatar);
  }

  /* ---------- 6. Result ---------- */
  function showResult() {
    const c = S.c, g = S.grade;
    ++S.token;
    stopSpeaking();
    app.textContent = "";
    const note = h("span", { class: "idle", id: "idleNote" });
    app.appendChild(h("div", { class: "card", id: "final", style: "max-width:1100px;margin:2vh auto" },
      h("div", { class: "step", text: "Your result" }),
      h("div", { class: "total", id: "finalScore" }, fmtNum(g.total), h("small", { text: " / 10" })),
      h("div", { class: "row-actions" }, h("span", { class: "tier " + g.outcome.outcomeTier, id: "finalTier", text: "Patient outcome: " + (OUTCOME_LABEL[g.outcome.outcomeTier] || "") }),
        h("span", { class: "mode " + (g.mode === "ai" ? "ai" : "prelim"), text: g.mode === "ai" ? "Graded by AI" : "Preliminary grading" })),
      h("p", { class: "hint", style: "margin-top:14px", text: "History " + fmtNum(g.history) + " / 5 · Diagnosis " + fmtNum(g.diagnosis) + " / 3 · Treatment " + fmtNum(g.treatment) + " / 2 · Case " + c.id }),
      h("div", { class: "save " + (S.saveState ? S.saveState.cls : ""), id: "saveStatus", text: S.saveState ? S.saveState.text : "Saving your score…" }),
      h("div", { class: "row-actions" }, note, h("span", { class: "grow" }), h("button", { class: "big-btn", id: "nextVisitorBtn", type: "button", onclick: checkIn }, "Next visitor"))));
    const tick = (left) => { note.textContent = "Resets for the next visitor in " + fmtTime(left); };
    tick(IDLE_RESET_S);
    startResultIdle(tick);
  }

  async function save() {
    const snap = S, g = S.grade;
    const set = (cls, text) => {
      snap.saveState = { cls, text };
      if (S !== snap) return;
      const el = document.getElementById("saveStatus");
      if (el) { el.className = "save " + cls; el.textContent = text; }
    };
    const durationS = Math.round(((snap.endedAt || Date.now()) - (snap.startedAt || Date.now())) / 1000);
    // Patient-turn sources, one letter each: o opener, f fast scripted (FAST_SCRIPTED_FIRST), a AI, s scripted fallback, l leak blocked
    const SRC = { opener: "o", fast: "f", ai: "a", scripted: "s", leak: "l" };
    const sources = snap.turns.filter((t) => t.role === "patient").map((t) => SRC[t.source] || "?").join("");
    try {
      const r = await saveScore(snap.player.studentId, "booth05", g.total, {
        attemptId: snap.attemptId, caseId: snap.c.id, history: g.history, diagnosis: g.diagnosis, treatment: g.treatment,
        optionId: g.option ? g.option.id : null, tier: g.option ? g.option.tier : null, outcomeTier: g.outcome.outcomeTier,
        durationS, mode: g.mode, sources, turns: snap.turns.filter((t) => t.role === "dentist").length, lang: snap.lang,
        avatar: snap.photo ? "photo" : "svg", needsSupervisor: g.needsSupervisor, injectionSuspected: g.injectionSuspected
      });
      if (r.queued) set("warn", "No connection right now: your score is stored on this device and will be sent automatically.");
      else if (r.counted === false) set("warn", "Practice attempt — not counted");
      else set("ok", "Your points were added to the leaderboard");
    } catch (err) {
      set("err", "Could not save the score: " + err.message);
    }
  }

  window.addEventListener("beforeunload", (e) => { if (S && S.deadline) { e.preventDefault(); e.returnValue = ""; } });
  checkIn();
})();
</script>
</body>
