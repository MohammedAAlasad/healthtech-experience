<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booth 03 — AI vs Human: Read the Scan</title>
<style>
  :root {
    --bg: #070b0d; --panel: #11191d; --panel2: #18242a; --ink: #f2f7f9; --muted: #93a8b0; --line: #2a3a41;
    --teal: #2ec4d6; --teal-dark: #0f6f7c; --ok: #3ddc84; --ok-bg: rgba(61,220,132,.16);
    --bad: #ff5c6c; --bad-bg: rgba(255,92,108,.15); --warn: #ffb02e; --ai: #b58cff; --gold: #ffcf3f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 22px; }
  .banner { background: #c4001d; color: #fff; text-align: center; font-weight: 800; padding: 10px 16px; font-size: 1.15rem; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 24px;
    background: #0c1316; border-bottom: 1px solid var(--line); }
  .brand { font-size: 1.6rem; font-weight: 900; }
  .brand .vs { color: var(--ai); }
  .brand small { display: block; font-size: .85rem; font-weight: 500; color: var(--muted); }
  .player { font-size: 1.3rem; font-weight: 800; text-align: right; }
  .timer { display: flex; align-items: center; gap: 16px; padding: 10px 24px; background: #0c1316; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10; }
  .timer[hidden] { display: none; }
  .timer-track { flex: 1; height: 26px; background: #22323a; border-radius: 13px; overflow: hidden; }
  .timer-fill { height: 100%; width: 100%; background: var(--ok); transition: width .25s linear, background-color .5s; }
  .timer-fill.mid { background: var(--warn); }
  .timer-fill.low { background: var(--bad); }
  .timer-text { font-size: 2rem; font-weight: 900; min-width: 4.2ch; text-align: right; font-variant-numeric: tabular-nums; }
  main { padding: 20px 24px 40px; max-width: 1880px; margin: 0 auto; }
  h1, h2, h3 { margin: 0 0 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  .step { font-size: 1rem; font-weight: 800; color: var(--teal); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 1.05rem; margin: 0 0 12px; }
  button { font: inherit; }
  .big-btn { min-height: 72px; min-width: 56px; font-size: 1.6rem; font-weight: 900; border: 0; border-radius: 14px; padding: 12px 36px;
    background: var(--teal); color: #031417; cursor: pointer; }
  .big-btn:disabled { background: #3b4f57; color: #9fb3b8; cursor: not-allowed; }
  .big-btn.wide { width: 100%; }
  .actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 16px; align-items: center; }
  .actions .grow { flex: 1; color: var(--muted); }

  /* Check-in (shared.js form) on the dark theme */
  .checkin-card { max-width: 760px; margin: 4vh auto 0; }
  #app .ht-input { background: #0b1215; color: var(--ink); border-color: #4b6670; }
  #app .ht-input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(46,196,214,.3); }
  #app .ht-err { color: var(--bad); }
  #app .ht-btn { background: var(--teal); color: #031417; min-height: 72px; }
  #app .ht-welcome { color: var(--ink); }

  /* Case screen */
  .case { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; align-items: stretch; }
  @media (max-width: 1100px) { .case { grid-template-columns: 1fr; } }
  .xray { position: relative; background: #000; border-radius: 18px; border: 1px solid var(--line); overflow: hidden;
    display: grid; place-items: center; min-height: 60vh; cursor: zoom-in; padding: 0; width: 100%; }
  .xray img { max-width: 100%; max-height: 74vh; display: block; object-fit: contain; }
  .xray .zoom-hint { position: absolute; right: 12px; bottom: 12px; background: rgba(0,0,0,.7); color: #fff; font-size: .95rem;
    font-weight: 700; padding: 6px 12px; border-radius: 8px; pointer-events: none; }
  .xray .missing { color: var(--muted); font-size: 1.3rem; padding: 40px; text-align: center; }
  .question { font-size: 1.7rem; font-weight: 800; line-height: 1.3; margin: 0 0 16px; }
  .answer { width: 100%; min-height: 40vh; font: inherit; font-size: 1.45rem; line-height: 1.45; color: var(--ink); background: #0b1215;
    border: 3px solid #4b6670; border-radius: 14px; padding: 14px 16px; resize: vertical; }
  .answer:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(46,196,214,.3); }
  .counter { color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }

  /* Zoom overlay */
  .zoom { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; cursor: zoom-out; }
  .zoom[hidden] { display: none; }
  .zoom img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  .zoom .zoom-bar { position: absolute; top: 12px; right: 12px; display: flex; gap: 12px; align-items: center; }
  .zoom .zoom-timer { background: rgba(0,0,0,.75); color: #fff; font-size: 1.6rem; font-weight: 900; padding: 6px 14px; border-radius: 10px;
    font-variant-numeric: tabular-nums; }
  .zoom .zoom-close { min-height: 56px; min-width: 56px; font-size: 1.3rem; font-weight: 800; border: 2px solid #fff; background: rgba(0,0,0,.6);
    color: #fff; border-radius: 12px; padding: 0 18px; cursor: pointer; }

  /* Analysing */
  .analysing { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; align-items: center; }
  @media (max-width: 1100px) { .analysing { grid-template-columns: 1fr; } }
  .scanbox { position: relative; background: #000; border-radius: 18px; overflow: hidden; display: grid; place-items: center; min-height: 60vh; }
  .scanbox img { max-width: 100%; max-height: 70vh; filter: brightness(.75); }
  .scanbox::after { content: ""; position: absolute; left: 0; right: 0; height: 22%; top: -22%;
    background: linear-gradient(180deg, transparent, rgba(46,196,214,.15) 60%, rgba(46,196,214,.75) 98%, transparent);
    animation: sweep 1.6s linear infinite; }
  @keyframes sweep { to { top: 100%; } }
  .scanbox .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(46,196,214,.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(46,196,214,.12) 1px, transparent 1px); background-size: 48px 48px; }
  .analysing-text { font-size: 2.4rem; font-weight: 900; color: var(--ai); }
  .dots span { animation: blink 1.2s infinite; } .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  .analysing ul { color: var(--muted); font-size: 1.2rem; line-height: 1.8; padding-left: 1.2em; }
  @media (prefers-reduced-motion: reduce) { .scanbox::after, .dots span { animation: none; } }

  /* Result */
  .scorebar { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 32px; margin-bottom: 18px; }
  .scorebox { background: var(--panel2); border-radius: 16px; padding: 12px 22px; border: 2px solid var(--line); }
  .scorebox .lbl { font-size: 1rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .scorebox .val { font-size: 3.4rem; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .scorebox .val small { font-size: 1.6rem; color: var(--muted); }
  .scorebox.you .val { color: var(--teal); }
  .scorebox.ai .val { color: var(--ai); }
  .next-wrap { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .case-no { color: var(--muted); font-size: 1.1rem; font-weight: 700; }
  .badge { font-size: 1.7rem; font-weight: 900; padding: 12px 22px; border-radius: 14px; }
  .badge.win { background: var(--gold); color: #1d1600; }
  .badge.tie { background: #3a4b52; color: #fff; }
  .badge.lose { background: transparent; color: var(--muted); border: 2px dashed var(--line); font-size: 1.3rem; }
  .mode { font-size: 1rem; font-weight: 800; padding: 6px 12px; border-radius: 8px; }
  .mode.prelim { background: var(--warn); color: #241800; }
  .mode.ai { background: rgba(181,140,255,.2); color: var(--ai); }
  .timeup { background: var(--bad); color: #fff; font-weight: 900; font-size: 1.3rem; padding: 8px 16px; border-radius: 10px; }
  .feedback { font-size: 1.4rem; font-weight: 700; margin: 0 0 18px; }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items: stretch; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; font-size: 1.15rem; line-height: 1.45; }
  .col h2 { font-size: 1.5rem; }
  .result-figure { margin: 16px 0 0; }
  .result-figure img { display: block; max-width: 100%; max-height: 22vh; border-radius: 8px; }
  .img-source { font-size: .9rem; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
  .col.you { border-top: 6px solid var(--teal); }
  .col.ai { border-top: 6px solid var(--ai); }
  .col.expert { border-top: 6px solid var(--ok); }
  .student-text { white-space: pre-wrap; word-wrap: break-word; background: #0b1215; border-radius: 10px; padding: 12px 14px; min-height: 4em; }
  .student-text.empty { color: var(--muted); font-style: italic; }
  mark.hit { background: var(--ok-bg); color: var(--ok); border-bottom: 3px solid var(--ok); border-radius: 4px; padding: 0 2px; }
  .list { list-style: none; padding: 0; margin: 8px 0 0; }
  .list li { padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; background: var(--panel2); display: flex; justify-content: space-between; gap: 10px; }
  .list li.good { background: var(--ok-bg); }
  .list li.miss { background: transparent; border: 2px dashed var(--line); }
  .list li.wrong { background: var(--bad-bg); }
  .pts { font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sub { font-size: .95rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 4px; }
  .impression { font-size: 1.3rem; font-weight: 800; }
  .limitation { color: var(--warn); font-size: 1rem; margin-top: 10px; }
  .conf { font-size: .9rem; font-weight: 800; padding: 2px 8px; border-radius: 6px; background: #2a3a41; margin-left: 6px; }
  .explain { white-space: pre-line; background: #0b1215; border-left: 5px solid var(--ok); padding: 10px 14px; border-radius: 8px; }

  /* Final */
  .final { max-width: 1100px; margin: 0 auto; }
  .total { font-size: 6rem; font-weight: 900; color: var(--teal); line-height: 1; font-variant-numeric: tabular-nums; }
  .total small { font-size: 2.4rem; color: var(--muted); }
  .breakdown { width: 100%; border-collapse: collapse; font-size: 1.4rem; margin: 18px 0; }
  .breakdown th { text-align: left; color: var(--muted); font-size: 1rem; text-transform: uppercase; padding: 6px; }
  .breakdown td { padding: 12px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .breakdown td.num, .breakdown th.num { text-align: right; }
  .breakdown td:last-child, .breakdown th:last-child { padding-left: 32px; }
  .save { font-size: 1.4rem; font-weight: 800; padding: 14px 18px; border-radius: 12px; margin: 12px 0; background: var(--panel2); }
  .save.ok { background: var(--ok-bg); color: var(--ok); }
  .save.warn { background: rgba(255,176,46,.15); color: var(--warn); }
  .save.err { background: var(--bad-bg); color: var(--bad); }
</style>
</head>

</header>
<div class="timer" id="timerBar" aria-label="Time left" hidden>

</div>
<main id="app"></main>
<div class="zoom" id="zoom" hidden role="dialog" aria-label="Zoomed X-ray">

</div>

function normalizeWithMap(text) {
  text = String(text == null ? "" : text);
  let out = "";

  for (let i = 0; i < text.length; i++) {

    if (/[ً-ٰٟـ]/.test(ch)) continue; // tashkeel + tatweel
    if (/[أإآٱ]/.test(ch)) ch = "ا";
    else if (ch === "ة") ch = "ه";
    else if (ch === "ى") ch = "ي";
    else if (ch === "ؤ") ch = "و";
    else if (ch === "ئ") ch = "ي";

  const items = keyItems(key);
  const byId = new Map(items.map((x) => [x.id, x]));
  const canon = new Map(items.map((x) => [String(x.label).trim().toLowerCase(), x]));
  // Old-style string entries: "Diagnosis: X (note)" -> "x". Exact label match only, credit 1.
  const legacyLabel = (v) => v.trim().replace(/^diagnosis\s*:\s*/i, "").replace(/(\s*\([^()]*\))+\s*$/, "").trim().toLowerCase();
  // matched: [{id, credit}] -> Map(item -> credit). Unknown ids ignored; credit must be exactly 0, 0.5 or 1
  // (anything else counts as 0); each item counts once (first entry wins).
  const accept = (arr) => {
    const out = new Map();
    for (const v of Array.isArray(arr) ? arr : []) {
      let it = null, credit = 0;
      if (v && typeof v === "object" && !Array.isArray(v)) {
        it = typeof v.id === "string" ? byId.get(v.id.trim().toUpperCase()) : null;
        credit = v.credit === 1 || v.credit === 0.5 ? v.credit : 0;
      } else if (typeof v === "string") {
        it = canon.get(legacyLabel(v)) || null;
        credit = 1;
      }
      if (it && !out.has(it)) out.set(it, credit);
    }
    return out;
  };
  const hasScore = typeof result.score === "number" || (typeof result.score === "string" && result.score.trim() !== "");
  if (!hasScore && !Array.isArray(result.matched)) return null;

  let credits = accept(result.matched);
  const wrong = (Array.isArray(result.wrong) ? result.wrong : []).filter((w) => typeof w === "string" && w.trim())
    .slice(0, 3).map((w) => w.trim().slice(0, 200));
  const recomputed = clamp([...credits].reduce((s, [x, c]) => s + c * x.points, 0) - wrong.length, 0, 10);
  let score = hasScore ? Number(result.score) : NaN;
  let overridden = false;
  if (!isFinite(score) || score < 0 || score > 10 || Math.abs(score - recomputed) > SCORE_TOLERANCE) {
    if (typeof console !== "undefined") console.warn("grade guard: model score " + result.score + " replaced by recomputed " + recomputed);
    score = recomputed;
    overridden = true;
  }
  if (looksLikeInjection(answer)) {
    const local = localGrade(key, answer);
    if (score > local.score) {
      if (typeof console !== "undefined") console.warn("grade guard: possible prompt injection; capped at keyword score " + local.score);
      score = local.score;
      credits = new Map(items.filter((x) => local.matched.includes(x.label)).map((x) => [x, 1]));
      overridden = true;
    }
  }
  const found = items.filter((x) => (credits.get(x) || 0) > 0);
  const matchedLabels = found.map((x) => x.label);
  let feedback = typeof result.feedback === "string" ? result.feedback.trim().slice(0, 300) : "";
  if (!feedback || overridden) feedback = localFeedback(answer, found.length, items.length);
  return {
    score: roundHalf(clamp(score, 0, 10)), matched: matchedLabels,
    missed: items.map((x) => x.label).filter((l) => !matchedLabels.includes(l)),
    credit: Object.fromEntries(found.map((x) => [x.label, credits.get(x)])),
    wrong, feedback, mode: "ai", overridden
  };
}

/** Model answer (or null/error) -> final grading. Never fails. mode "local" = "Preliminary grading". */
function gradeFromModel(key, answer, result) {
  const g = guardGrade(key, answer, result);
  return g || localGrade(key, answer);
}

/** Pick n case ids: no repeats while unseen cases remain; first pick avoids lastFirstId. */
function pickCases(cases, n, lastFirstId, rand) {
  rand = rand || Math.random;
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  if (!cases.length) return [];
  let order = shuffle(cases);
  if (order.length > 1 && order[0].id === lastFirstId) order.push(order.shift());
  const out = order.slice(0, n);
  while (out.length < n) { // fewer cases than rounds: repeat, but never the same case twice in a row
    const next = shuffle(cases).find((c) => c.id !== out[out.length - 1].id) || cases[0];
    out.push(next);
  }
  return out;
}

if (typeof module !== "undefined") {
  module.exports = { CASES, ROUNDS, GRADING_PROMPT, buildGradingPrompt, guardGrade, gradeFromModel, localGrade,
    keywordSpans, normalize, roundHalf, roundTotal, pickCases, looksLikeInjection, keyItems };
}
</script>

<!-- UI -->
<script>
(function () {
  const app = document.getElementById("app");
  const timerBar = document.getElementById("timerBar");
  const timerFill = document.getElementById("timerFill");
  const timerText = document.getElementById("timerText");
  const playerName = document.getElementById("playerName");
  const zoom = document.getElementById("zoom");
  const zoomImg = document.getElementById("zoomImg");
  const zoomTimer = document.getElementById("zoomTimer");
  const LAST_FIRST_KEY = "scan_lastFirstCaseId";

  const ACTIVE = CASES.filter((c) => c.reviewStatus !== "REJECTED");
  document.getElementById("draftBanner").hidden = ACTIVE.length > 0 && ACTIVE.every((c) => c.reviewStatus === "APPROVED" && !c.placeholder);

  let S = null; // visitor state

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) {
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
    }
    return el;
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const fmtPts = (x) => (Math.round(x * 10) / 10).toString();

  /* ---------------- Timer ---------------- */
  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  }
  function drawTimer(left) {
    const pct = clamp((left / TIME_LIMIT_S) * 100, 0, 100);
    timerFill.style.width = pct + "%";
    timerFill.classList.toggle("mid", left <= 45 && left > 15);
    timerFill.classList.toggle("low", left <= 15);
    timerText.textContent = fmt(left);
    zoomTimer.textContent = fmt(left);
  }
  function secondsLeft() { return S && S.deadline ? Math.max(0, (S.deadline - performance.now()) / 1000) : TIME_LIMIT_S; }
  function startTimer(onTimeout) {
    stopTimer();
    S.deadline = performance.now() + TIME_LIMIT_S * 1000;
    timerBar.hidden = false;
    drawTimer(TIME_LIMIT_S);
    S.timerId = setInterval(() => {
      const left = secondsLeft();
      drawTimer(left);
      if (left <= 0) onTimeout();
    }, 200);
  }
  function stopTimer() {
    if (S && S.timerId) clearInterval(S.timerId);
    if (S) { S.timerId = null; S.deadline = null; }
  }

  /* ---------------- Zoom ---------------- */
  function openZoom(src) { zoomImg.src = src; zoom.hidden = false; }
  function closeZoom() { zoom.hidden = true; }
  zoom.addEventListener("click", closeZoom);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !zoom.hidden) closeZoom(); });

  /* ---------------- Screens ---------------- */
  function checkIn() {
    stopTimer();
    closeZoom();
    S = null;
    timerBar.hidden = true;
    playerName.textContent = "";
    app.textContent = "";
    if (!ACTIVE.length) {
      app.appendChild(h("div", { class: "card checkin-card" }, h("h2", { text: "No cases available" }),
        h("p", { class: "hint", text: "Run tools/inject_cases.py to load data/cases.json into this page." })));
      return;
    }
    const box = h("div", { class: "card checkin-card" });
    app.appendChild(box);
    startCheckIn(box, onReady, {
      title: "Booth 03 — Participant check-in",
      subtitle: "Operator: type the visitor's University ID and name, then press Start.",
      welcomePrefix: ""
    });
  }

  function onReady(player) {
    const picks = pickCases(ACTIVE, ROUNDS, localStorage.getItem(LAST_FIRST_KEY));
    localStorage.setItem(LAST_FIRST_KEY, picks[0].id);
    S = { player, picks, round: 0, results: [], attemptId: htMakeId(), deadline: null, timerId: null, token: 0 };
    playerName.textContent = player.name;
    showCase();
  }

  function xrayView(c) {
    const img = h("img", { src: c.image, alt: "Dental radiograph " + c.id, draggable: "false" });
    const btn = h("button", { class: "xray", type: "button", "aria-label": "Zoom the X-ray to full screen" }, img,
      h("span", { class: "zoom-hint", text: "🔍 Tap to zoom" }));
    img.addEventListener("error", () => { btn.replaceChildren(h("div", { class: "missing", text: "Image not found: " + c.image })); });
    btn.addEventListener("click", () => openZoom(c.image));
    return btn;
  }

  function showCase() {
    const c = S.picks[S.round];
    const token = ++S.token;
    app.textContent = "";
    const ta = h("textarea", { class: "answer", id: "answer", dir: "auto", maxlength: String(ANSWER_MAX_CHARS), spellcheck: "false",
      placeholder: "Write what you see and your diagnosis (English or Arabic)", "aria-label": "Your reading" });
    const counter = h("span", { class: "counter", text: "0 / " + ANSWER_MAX_CHARS });
    ta.addEventListener("input", () => { counter.textContent = ta.value.length + " / " + ANSWER_MAX_CHARS; });
    const submit = h("button", { class: "big-btn", id: "submitBtn", type: "button" }, "Submit");
    const done = (timedOut) => {
      if (token !== S.token || S.submitted === token) return;
      S.submitted = token;
      stopTimer();
      closeZoom();
      submitAnswer(c, ta.value, timedOut);
    };
    submit.addEventListener("click", () => done(false));
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); done(false); } });

    app.appendChild(h("div", { class: "case" },
      xrayView(c),
      h("div", { class: "card", style: "display:flex;flex-direction:column" },
        h("div", { class: "step", text: "Case " + (S.round + 1) + " of " + ROUNDS }),
        h("p", { class: "question", text: c.question }),
        ta,
        h("div", { class: "actions" }, h("span", { class: "grow" }, counter), submit)
      )
    ));
    startTimer(() => done(true));
    setTimeout(() => ta.focus(), 0);
  }

  async function submitAnswer(c, answer, timedOut) {
    const token = S.token;
    answer = String(answer || "").slice(0, ANSWER_MAX_CHARS);
    timerBar.hidden = true;
    let g;
    if (!answer.trim()) {
      g = localGrade(c.key, answer); // empty: 0, no grade() call
    } else {
      showAnalysing(c);
      const call = grade(buildGradingPrompt(c.key, answer)).then((r) => r, (err) => {
        console.warn("grade() failed, using preliminary keyword grading:", err && err.message);
        return null;
      });
      const [result] = await Promise.all([call, sleep(MIN_ANALYSE_MS)]);
      g = gradeFromModel(c.key, answer, result);
    }
    if (!S || token !== S.token) return; // operator moved on
    const r = { caseId: c.id, score: g.score, aiScore: c.aiScore, mode: g.mode, answer, grading: g, timedOut };
    S.results.push(r);
    showResult(c, r);
  }

  function showAnalysing(c) {
    app.textContent = "";
    app.appendChild(h("div", { class: "analysing", id: "analysing" },
      h("div", { class: "scanbox" }, h("img", { src: c.image, alt: "" }), h("div", { class: "grid" })),
      h("div", {},
        h("div", { class: "analysing-text" }, "AI is analysing the scan", h("span", { class: "dots" }, h("span", { text: "." }), h("span", { text: "." }), h("span", { text: "." }))),
        h("ul", {}, h("li", { text: "Comparing your reading with the expert key" }), h("li", { text: "Checking findings and diagnosis" }),
          h("li", { text: "Loading the AI's own reading of this scan" }))
      )
    ));
  }

  /** Student text with keyword hits of matched items wrapped in <mark>, built with text nodes only. */
  function highlightedAnswer(c, answer, matchedLabels) {
    const box = h("div", { class: "student-text", dir: "auto" });
    if (!answer.trim()) { box.classList.add("empty"); box.textContent = "(no answer)"; return box; }
    let spans = [];
    for (const it of keyItems(c.key)) {
      if (!matchedLabels.includes(it.label)) continue;
      for (const k of it.keywords) spans = spans.concat(keywordSpans(answer, k));
    }
    spans.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
    const merged = [];
    for (const s of spans) {
      const last = merged[merged.length - 1];
      if (last && s[0] <= last[1]) last[1] = Math.max(last[1], s[1]); else merged.push(s.slice());
    }
    let pos = 0;
    for (const [a, b] of merged) {
      if (a > pos) box.appendChild(document.createTextNode(answer.slice(pos, a)));
      box.appendChild(h("mark", { class: "hit", text: answer.slice(a, b) }));
      pos = b;
    }
    if (pos < answer.length) box.appendChild(document.createTextNode(answer.slice(pos)));
    return box;
  }

  function showResult(c, r) {
    app.textContent = "";
    const g = r.grading;
    const items = keyItems(c.key);
    const ptsOf = (label) => (items.find((x) => x.label === label) || {}).points;
    let badge;
    if (r.score > c.aiScore) badge = h("div", { class: "badge win", id: "badge", text: "You beat the AI!" });
    else if (r.score === c.aiScore) badge = h("div", { class: "badge tie", id: "badge", text: "Tie with the AI" });
    else badge = h("div", { class: "badge lose", id: "badge", text: "The AI wins this one" });
    const prelim = g.mode === "local" || g.mode === "empty";
    const last = S.round + 1 >= ROUNDS;

    const ai = c.aiReading;
    app.appendChild(h("div", { id: "result" },
      h("div", { class: "scorebar" },
        h("div", { class: "scorebox you" }, h("div", { class: "lbl", text: "Your score" }),
          h("div", { class: "val", id: "studentScore" }, fmtPts(r.score), h("small", { text: " / 10" }))),
        h("div", { class: "scorebox ai" }, h("div", { class: "lbl", text: "AI score" }),
          h("div", { class: "val", id: "aiScore" }, fmtPts(c.aiScore), h("small", { text: " / 10" }))),
        badge,
        r.timedOut ? h("span", { class: "timeup", text: "Time's up!" }) : null,
        h("span", { class: "mode " + (prelim ? "prelim" : "ai"), id: "gradingMode",
          text: prelim ? (g.mode === "empty" ? "Preliminary grading (empty answer)" : "Preliminary grading") : "Graded by AI against the expert key" }),
        h("span", { class: "next-wrap" },
          h("span", { class: "case-no", text: "Case " + (S.round + 1) + " of " + ROUNDS }),
          h("button", { class: "big-btn", id: "nextBtn", type: "button", onclick: () => {
            if (last) showFinal(); else { S.round++; showCase(); }
          } }, last ? "See final score" : "Next"))
      ),
      h("p", { class: "feedback", dir: "auto", text: g.feedback }),
      h("div", { class: "cols" },
        h("section", { class: "col you", id: "colYou" },
          h("h2", { text: "Your reading" }),
          highlightedAnswer(c, r.answer, g.matched),
          h("div", { class: "sub", text: "Found" }),
          g.matched.length ? h("ul", { class: "list" }, g.matched.map((m) => h("li", { class: "good" }, h("span", { text: "✓ " + m }), h("span", { class: "pts", text: "+" + fmtPts(ptsOf(m) * ((g.credit && g.credit[m]) || 1)) }))))
            : h("div", { class: "hint", text: "None of the key points." }),
          h("div", { class: "sub", text: "Missed" }),
          g.missed.length ? h("ul", { class: "list", id: "missedList" }, g.missed.map((m) => h("li", { class: "miss" }, h("span", { text: m }), h("span", { class: "pts", text: String(ptsOf(m)) }))))
            : h("div", { class: "hint", text: "Nothing — you found every key point!" }),
          g.wrong.length ? h("div", {}, h("div", { class: "sub", text: "Wrong claims (−1 each)" }),
            h("ul", { class: "list" }, g.wrong.map((w) => h("li", { class: "wrong", dir: "auto", text: w })))) : null
        ),
        h("section", { class: "col ai", id: "colAi" },
          h("h2", {}, "AI reading", h("span", { class: "conf", text: "confidence: " + ai.confidence })),
          h("div", { class: "sub", text: "Findings" }),
          h("ul", { class: "list" }, ai.findings.map((f) => h("li", { dir: "auto", text: f }))),
          h("div", { class: "sub", text: "Impression" }),
          h("div", { class: "impression", dir: "auto", text: ai.impression }),
          h("div", { class: "sub", text: "AI score vs the expert key" }),
          h("div", { class: "impression", text: fmtPts(c.aiScore) + " / 10" }),
          h("div", { class: "limitation", dir: "auto", text: "⚠ Limitation: " + ai.limitation })
        ),
        h("section", { class: "col expert", id: "colExpert" },
          h("h2", { text: "Expert answer" }),
          h("div", { class: "sub", text: "Key findings" }),
          h("ul", { class: "list" }, c.key.keyFindings.map((f) => h("li", {}, h("span", { dir: "auto", text: f.finding }), h("span", { class: "pts", text: f.points + " pts" })))),
          h("div", { class: "sub", text: "Diagnosis" }),
          h("ul", { class: "list" }, h("li", {}, h("span", { class: "impression", dir: "auto", text: c.key.diagnosis }), h("span", { class: "pts", text: c.key.diagnosisPoints + " pts" }))),
          h("div", { class: "sub", text: "Why" }),
          h("div", { class: "explain", dir: "auto", text: c.expertExplanation }),
          h("figure", { class: "result-figure" },
            h("img", { src: c.image, alt: "Dental radiograph " + c.id }),
            c.source ? h("figcaption", { class: "img-source", id: "imgSource", text: "Image source: " + c.source }) : null)
        )
      )
    ));
    window.scrollTo(0, 0);
  }

  function showFinal() {
    S.token++;
    app.textContent = "";
    const total = roundTotal(S.results.reduce((s, r) => s + r.score, 0));
    const aiTotal = roundTotal(S.results.reduce((s, r) => s + r.aiScore, 0));
    const saveBox = h("div", { class: "save", id: "saveStatus", text: "Saving your score…" });
    app.appendChild(h("div", { class: "card final", id: "final" },
      h("div", { class: "step", text: "Final score" }),
      h("div", { class: "total", id: "totalScore" }, fmtPts(total), h("small", { text: " / 30" })),
      h("p", { class: "feedback", text: total > aiTotal ? "You beat the AI overall (" + fmtPts(aiTotal) + " / 30)!"
        : total === aiTotal ? "A tie with the AI overall (" + fmtPts(aiTotal) + " / 30)." : "The AI scored " + fmtPts(aiTotal) + " / 30 on these scans." }),
      h("table", { class: "breakdown" },
        h("thead", {}, h("tr", {}, h("th", { text: "Case" }), h("th", { class: "num", text: "You" }), h("th", { class: "num", text: "AI" }), h("th", { text: "Grading" }))),
        h("tbody", {}, S.results.map((r, i) => h("tr", {},
          h("td", { text: "Case " + (i + 1) }), h("td", { class: "num", text: fmtPts(r.score) + " / 10" }),
          h("td", { class: "num", text: fmtPts(r.aiScore) + " / 10" }),
          h("td", { text: r.mode === "ai" ? "AI" : "Preliminary" }))))
      ),
      saveBox,
      h("div", { class: "actions" }, h("button", { class: "big-btn wide", id: "newVisitor", type: "button", onclick: checkIn }, "New Visitor"))
    ));
    save(total);
  }

  async function save(total) {
    const snap = S;
    const set = (cls, text) => {
      if (S !== snap) return;
      const el = document.getElementById("saveStatus");
      if (el) { el.className = "save " + cls; el.textContent = text; }
    };
    try {
      const r = await saveScore(S.player.studentId, "booth03", total, {
        perCase: S.results.map((x) => ({ caseId: x.caseId, score: x.score, aiScore: x.aiScore, mode: x.mode })),
        attemptId: S.attemptId
      });
      if (r.queued) set("warn", "No connection right now: your score is stored on this device and will be sent automatically.");
      else if (r.counted === false) set("warn", "Practice attempt — not counted");
      else set("ok", "Your points were added to the leaderboard");
    } catch (err) {
      set("err", "Could not save the score: " + err.message);
    }
  }

  window.addEventListener("beforeunload", (e) => {
    if (S && S.deadline) { e.preventDefault(); e.returnValue = ""; }
  });

  checkIn();
})();
</script>
