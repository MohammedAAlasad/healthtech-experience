<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard — HealthTech Experience</title>
<script>
/* Layout: ?rotate=90|270 (landscape design rotated into a portrait screen), ?layout=portrait|landscape (forced;
   landscape on a portrait screen is shown letterboxed),
   otherwise the (orientation: portrait) media query decides, live. Sets html.portrait / .landscape / .rotated. */
(function () {
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  const rot = q.get("rotate"), lay = q.get("layout");
  if (rot === "90" || rot === "270") { root.classList.add("rotated"); root.dataset.deg = rot; return; }
  // Forced landscape on a portrait screen: show the 1920x1080 design letterboxed (same frame, no rotation).
  if (lay === "landscape" && innerHeight > innerWidth) { root.classList.add("rotated"); root.dataset.deg = "0"; return; }
  if (lay === "portrait" || lay === "landscape") { root.classList.add(lay); return; }
  const mq = matchMedia("(orientation: portrait)");
  const apply = () => { root.classList.toggle("portrait", mq.matches); root.classList.toggle("landscape", !mq.matches); };
  apply();
  mq.addEventListener("change", apply);
})();
</script>
<style>
  :root { --bg: #0b1418; --panel: #13232a; --row: #172b33; --ink: #f2f7f9; --muted: #8fa7b0; --teal: #2ec4d6;
    --gold: #ffcf3f; --silver: #d4dde2; --bronze: #e0955a; --bad: #ff5c6c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  .wrap { display: grid; grid-template-rows: auto 1fr; height: 100vh; padding: 1.6vh 2vw; gap: 1.6vh; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; line-height: 1.2; }
  .titles { display: flex; align-items: baseline; gap: 1.6vw; min-width: 0; }
  h1 { margin: 0; font-size: 5vh; line-height: 1.1; letter-spacing: .02em; }
  .event { font-size: 2.8vh; color: var(--teal); font-weight: 700; white-space: nowrap; }
  .status { text-align: right; font-size: 2.1vh; color: var(--muted); white-space: nowrap; }
  .status.bad { color: var(--bad); font-weight: 700; }
  /* minmax(0, …) stops long names from widening the columns and pushing content off-screen. */
  .grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 1.6vw; min-height: 0; }
  .board { position: relative; display: flex; flex-direction: column; gap: .8vh; min-height: 0; min-width: 0; }
  /* Landscape: one row = one line: rank | name (ellipsis) | four score chips | total. Fixed height, never shrinks. */
  .row { display: flex; align-items: center; gap: 1.2vw; flex: none; box-sizing: border-box;
    min-height: 8vh; height: 8vh; padding: 0 1.4vw; line-height: 1.2; background: var(--row);
    border-radius: 1.4vh; border: .3vh solid transparent; will-change: transform; }
  .rank { flex: none; width: 6vh; font-size: 4.4vh; line-height: 1.2; font-weight: 900; text-align: center;
    color: var(--muted); font-variant-numeric: tabular-nums; }
  .name { flex: 1 1 auto; min-width: 0; font-size: 3.6vh; line-height: 1.25; font-weight: 800;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { flex: none; display: flex; align-items: center; gap: .5vw; }
  .chip { display: inline-flex; align-items: baseline; gap: .5em; white-space: nowrap;
    font-size: max(22px, 2.6vh); line-height: 1.2; padding: .5vh .8vw; border-radius: 999px;
    font-weight: 600; color: #08161b; font-variant-numeric: tabular-nums; }
  .chip b { font-weight: 900; min-width: 2ch; text-align: right; } /* fixed width: chips line up in columns */
  .chip span { font-size: .8em; } /* smaller label, full-size number: four chips leave room for the name */
  .chip.b03 { background: #d9ccff; }
  .chip.b06 { background: #b8eef5; }
  .chip.b05 { background: #ffe1a8; }
  .chip.b01 { background: #c4f2c2; }
  .total { flex: none; min-width: 2.6ch; text-align: right; font-size: 5vh; line-height: 1.2; font-weight: 900;
    font-variant-numeric: tabular-nums; color: var(--teal); }
  .row.r1 { border-color: var(--gold); background: linear-gradient(90deg, rgba(255,207,63,.22), var(--row) 60%); }
  .row.r2 { border-color: var(--silver); background: linear-gradient(90deg, rgba(212,221,226,.18), var(--row) 60%); }
  .row.r3 { border-color: var(--bronze); background: linear-gradient(90deg, rgba(224,149,90,.2), var(--row) 60%); }
  .row.r1 .rank { color: var(--gold); } .row.r2 .rank { color: var(--silver); } .row.r3 .rank { color: var(--bronze); }
  .row.r1 .total { color: var(--gold); }
  .row.flash { animation: flash 3s ease-out; }
  @keyframes flash {
    0%, 30%, 60% { box-shadow: 0 0 0 .6vh var(--teal), 0 0 4vh var(--teal); background: #1f5560; }
    15%, 45%, 75% { box-shadow: 0 0 0 0 transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .empty { font-size: 4vh; color: var(--muted); text-align: center; margin-top: 20vh; }
  aside { display: flex; flex-direction: column; gap: 1.1vh; min-height: 0; }
  .panel { background: var(--panel); border-radius: 1.6vh; padding: 1.1vh 1.2vw; }
  .panel h2 { margin: 0 0 .6vh; font-size: 2.3vh; line-height: 1.25; color: var(--teal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini { list-style: none; margin: 0; padding: 0; }
  .mini li { display: grid; grid-template-columns: 4vh 1fr auto; gap: 0 1vw; font-size: 2.5vh; padding: .3vh 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .mini li:last-child { border-bottom: 0; }
  .mini .n { font-weight: 900; color: var(--muted); }
  .mini .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  .mini .p { font-weight: 900; font-variant-numeric: tabular-nums; }
  .mini .none { color: var(--muted); display: block; }
  .mini .info { grid-column: 2 / 4; font-size: 2vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -.4vh; }
  .count-panel { display: flex; align-items: baseline; gap: 1vw; }
  .count { font-size: 6vh; font-weight: 900; line-height: 1; color: var(--ink); }
  .count-label { font-size: 2.4vh; color: var(--muted); }

  /* Kiosk: the cursor disappears after 3 s without mouse movement. */
  html.nocursor, html.nocursor * { cursor: none !important; }

  /* ?rotate=90|270: this page only holds a 1920x1080 frame showing the landscape design, rotated and scaled to fit. */
  html.rotated .wrap, html.rotated .ht-badge { display: none !important; }
  #rotFrame { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; border: 0; display: block; }

  /* Portrait kiosk (designed for exactly 1080x1920). --u = 1/100 of a 1080x1920 box fitted into the screen,
     so a 1080x1920 screen is filled exactly and other portrait sizes are letterboxed, never cut off. */
  html.portrait { --u: min(1vw, .5625vh); }
  html.portrait .wrap { width: calc(var(--u) * 100); height: calc(var(--u) * 177.77); margin: 0 auto;
    padding: calc(var(--u) * 2.4) calc(var(--u) * 2.8); gap: calc(var(--u) * 1.6); grid-template-rows: auto minmax(0, 1fr); }
  html.portrait header { flex-wrap: wrap; row-gap: calc(var(--u) * .4); column-gap: calc(var(--u) * 2); }
  html.portrait .titles { gap: calc(var(--u) * 2); }
  html.portrait h1 { font-size: calc(var(--u) * 6.4); }
  html.portrait .event { font-size: calc(var(--u) * 3.2); }
  html.portrait .status { font-size: calc(var(--u) * 2.4); margin-left: auto; }
  html.portrait .grid { display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); }
  html.portrait .board { flex: 1 1 auto; gap: calc(var(--u) * .8); }
  /* Two-line row: rank | name over the four chips | total. The name gets the full width, so ~25 characters fit. */
  html.portrait .row { display: grid; grid-template-columns: calc(var(--u) * 7) minmax(0, 1fr) auto;
    grid-template-areas: "rank name total" "rank chips total"; align-items: center;
    column-gap: calc(var(--u) * 1.6); row-gap: calc(var(--u) * .3); height: auto; min-height: 0;
    padding: calc(var(--u) * .5) calc(var(--u) * 2); border-radius: calc(var(--u) * 1.4); border-width: calc(var(--u) * .3); }
  html.portrait .rank { grid-area: rank; width: auto; font-size: calc(var(--u) * 5.4); }
  html.portrait .name { grid-area: name; font-size: calc(var(--u) * 3.8); line-height: 1.15; }
  html.portrait .chips { grid-area: chips; gap: calc(var(--u) * .8); }
  html.portrait .chip { font-size: calc(var(--u) * 2.8); line-height: 1.1; padding: calc(var(--u) * .25) calc(var(--u) * .9); gap: .4em; }
  html.portrait .chip span { font-size: .76em; }
  /* Fixed width (fits "100" and "93.5"): the chip line has the same room in every row and never reaches the total. */
  html.portrait .total { grid-area: total; font-size: calc(var(--u) * 6); width: 3.7ch; min-width: 0; }
  html.portrait .empty { font-size: calc(var(--u) * 4.4); margin-top: calc(var(--u) * 30); }
  /* The four top-3 panels in a 2x2 grid under the ranking, then the participant count across both columns. */
  html.portrait aside { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: calc(var(--u) * 1.4); flex: none; }
  html.portrait .panel { border-radius: calc(var(--u) * 1.6); padding: calc(var(--u) * 1.2) calc(var(--u) * 1.8); }
  html.portrait .panel h2 { font-size: calc(var(--u) * 2.7); margin-bottom: calc(var(--u) * .6); }
  html.portrait .mini li { grid-template-columns: calc(var(--u) * 3.6) minmax(0, 1fr) auto; column-gap: calc(var(--u) * 1.2);
    font-size: calc(var(--u) * 2.8); padding: calc(var(--u) * .35) 0; }
  html.portrait .mini .info { font-size: calc(var(--u) * 2.1); margin-top: calc(var(--u) * -.3); }
  html.portrait .count-panel { grid-column: 1 / -1; gap: calc(var(--u) * 1.6); padding-top: calc(var(--u) * .9); padding-bottom: calc(var(--u) * .9); }
  html.portrait .count { font-size: calc(var(--u) * 5.6); }
  html.portrait .count-label { font-size: calc(var(--u) * 2.8); }
  html.portrait .row.flash { animation-name: flash-p; }
  @keyframes flash-p {
    0%, 30%, 60% { box-shadow: 0 0 0 calc(var(--u) * .6) var(--teal), 0 0 calc(var(--u) * 4) var(--teal); background: #1f5560; }
    15%, 45%, 75% { box-shadow: 0 0 0 0 transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <h1>Leaderboard</h1>
      <div class="event">HealthTech Experience</div>
    </div>
    <div class="status" id="status">Loading…</div>
  </header>
  <div class="grid">
    <section class="board" id="board" aria-label="Top 10"></section>
    <aside>
      <div class="panel"><h2>Read the Scan — Top 3</h2><ul class="mini" id="b03"></ul></div>
      <div class="panel"><h2>Diagnosis Challenge — Top 3</h2><ul class="mini" id="b06"></ul></div>
      <div class="panel"><h2>Virtual Patient — Top 3</h2><ul class="mini" id="b05"></ul></div>
      <div class="panel"><h2>AI Trainer — Top 3</h2><ul class="mini" id="b01"></ul></div>
      <div class="panel count-panel"><div class="count" id="count">–</div><div class="count-label">participants</div></div>
    </aside>
  </div>
</div>

<script src="../shared/shared.js"></script>
<script>
(function () {
  const root = document.documentElement;

  // Hide the mouse cursor after 3 s idle (kiosk). Runs in the rotated frame too.
  let cursorTimer = null;
  const wake = () => { root.classList.remove("nocursor"); clearTimeout(cursorTimer); cursorTimer = setTimeout(() => root.classList.add("nocursor"), 3000); };
  ["mousemove", "mousedown", "touchstart", "wheel"].forEach((e) => addEventListener(e, wake, { passive: true }));
  wake();

  // ?rotate=90|270 (or forced landscape on a portrait screen): show this same page (forced landscape, all other parameters such as ?mock=1 kept) in a
  // 1920x1080 frame, rotated and scaled to fill the screen. This outer page does not poll the backend.
  if (root.classList.contains("rotated")) {
    const q = new URLSearchParams(location.search);
    const deg = Number(root.dataset.deg) || 0;
    q.delete("rotate");
    q.set("layout", "landscape");
    const frame = document.createElement("iframe");
    frame.id = "rotFrame";
    frame.title = "Leaderboard";
    frame.setAttribute("scrolling", "no");
    frame.src = location.pathname + "?" + q.toString();
    const fit = () => {
      const scale = deg ? Math.min(innerWidth / 1080, innerHeight / 1920) : Math.min(innerWidth / 1920, innerHeight / 1080);
      frame.style.transform = "translate(-50%, -50%) rotate(" + deg + "deg) scale(" + scale + ")";
    };
    fit();
    addEventListener("resize", fit);
    document.body.appendChild(frame);
    return;
  }

  const POLL_MS = 5000;
  const board = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const rows = new Map(); // key -> {el, total}
  let firstRender = true;
  let lastOkAt = null;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const keyOf = (p) => p.idLast4 + "|" + p.name;

  /* Long names: shrink the font (down to 65%) until the name fits on its one line; only then the ellipsis shows. */
  const range = document.createRange();
  // Real text width vs the box (scrollWidth is rounded and misses sub-pixel overflow that still shows "…").
  const overflows = (e) => { range.selectNodeContents(e); return range.getBoundingClientRect().width > e.getBoundingClientRect().width + 0.1; };
  function fitText(e) {
    e.style.fontSize = "";
    if (!overflows(e)) return;
    const base = parseFloat(getComputedStyle(e).fontSize);
    for (let pct = 95; pct >= 65 && overflows(e); pct -= 5) e.style.fontSize = (base * pct / 100).toFixed(1) + "px";
  }
  const fitAll = () => document.querySelectorAll(".row .name, .mini .nm").forEach(fitText);
  let fitQueued = false;
  addEventListener("resize", () => { if (!fitQueued) { fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fitAll(); }); } });
  const timeStr = (d) => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  function renderTop(top) {
    top = (top || []).slice(0, 10);
    // FLIP step 1: remember where each row was.
    const before = new Map();
    rows.forEach((r, k) => before.set(k, r.el.getBoundingClientRect().top));

    const seen = new Set();
    top.forEach((p) => {
      const k = keyOf(p);
      seen.add(k);
      let r = rows.get(k);
      const isNew = !r;
      if (!r) {
        const row = el("div", "row");
        const chips = el("div", "chips");
        // Short chip labels so four booths fit next to a readable name; full names are on the side panels.
        for (const [cls, label] of [["b03", "Scan"], ["b06", "Diagnosis"], ["b05", "Patient"], ["b01", "Trainer"]]) {
          const chip = el("span", "chip " + cls);
          chip.append(el("span", null, label), el("b"));
          chips.appendChild(chip);
        }
        row.append(el("div", "rank"), el("div", "name"), chips, el("div", "total"));
        r = { el: row, total: null };
        rows.set(k, r);
      }
      const row = r.el;
      row.className = "row" + (p.rank <= 3 ? " r" + p.rank : "");
      row.querySelector(".rank").textContent = p.rank;
      row.querySelector(".name").textContent = p.name;
      const pb = p.perBooth || {};
      row.querySelector(".chip.b03 b").textContent = pb.booth03 || 0;
      row.querySelector(".chip.b06 b").textContent = pb.booth06 || 0;
      row.querySelector(".chip.b05 b").textContent = pb.booth05 || 0;
      row.querySelector(".chip.b01 b").textContent = pb.booth01 || 0;
      row.querySelector(".total").textContent = p.total;
      if (!firstRender && (isNew || r.total !== p.total)) {
        row.classList.remove("flash");
        void row.offsetWidth; // restart animation
        row.classList.add("flash");
        setTimeout(() => row.classList.remove("flash"), 3000);
      }
      r.total = p.total;
      board.appendChild(row); // moves it into the new order
    });
    rows.forEach((r, k) => { if (!seen.has(k)) { r.el.remove(); rows.delete(k); } });

    const empty = board.querySelector(".empty");
    if (!top.length && !empty) board.appendChild(el("div", "empty", "No scores yet — be the first!"));
    if (top.length && empty) empty.remove();

    // FLIP steps 2-4: slide rows from their old position to the new one.
    rows.forEach((r, k) => {
      if (!before.has(k)) return;
      const dy = before.get(k) - r.el.getBoundingClientRect().top;
      if (!dy) return;
      r.el.style.transition = "none";
      r.el.style.transform = "translateY(" + dy + "px)";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        r.el.style.transition = "transform 800ms cubic-bezier(.2,.8,.2,1)";
        r.el.style.transform = "";
      }));
    });
    firstRender = false;
  }

  const OUTCOME = { healed: "Healed", improved: "Partly improved", complication: "Complication", worse: "Got worse", unclear: "Unclear" };
  /** Booth 05 extra line: case · outcome · duration (all optional). */
  function infoText(info) {
    if (!info) return "";
    const parts = [];
    if (typeof info.caseId === "string") parts.push(info.caseId);
    if (typeof info.outcomeTier === "string") parts.push(OUTCOME[info.outcomeTier] || info.outcomeTier);
    if (typeof info.durationS === "number") parts.push(Math.floor(info.durationS / 60) + ":" + String(Math.round(info.durationS % 60)).padStart(2, "0"));
    return parts.join(" · ");
  }

  function renderMini(id, list) {
    const ul = document.getElementById(id);
    ul.textContent = "";
    (list || []).slice(0, 3).forEach((e) => {
      const li = el("li");
      li.append(el("span", "n", e.rank + "."), el("span", "nm", e.name), el("span", "p", String(e.points)));
      const extra = infoText(e.info);
      if (extra) li.append(el("span", "info", extra));
      ul.appendChild(li);
    });
    if (!ul.children.length) ul.appendChild(el("li", "none", "No scores yet"));
  }

  async function tick() {
    try {
      const data = await getLeaderboard();
      renderTop(data.top);
      renderMini("b03", data.perBooth && data.perBooth.booth03);
      renderMini("b06", data.perBooth && data.perBooth.booth06);
      renderMini("b05", data.perBooth && data.perBooth.booth05);
      renderMini("b01", data.perBooth && data.perBooth.booth01);
      document.getElementById("count").textContent = data.totalParticipants;
      fitAll();
      lastOkAt = new Date();
      statusEl.className = "status";
      statusEl.textContent = "Last updated " + timeStr(lastOkAt);
    } catch (err) {
      // Never blank the screen: keep the last data, just show the problem.
      statusEl.className = "status bad";
      statusEl.textContent = "Connection problem — showing data from " + (lastOkAt ? timeStr(lastOkAt) : "—");
      console.warn(err);
    } finally {
      setTimeout(tick, POLL_MS);
    }
  }
  tick();
})();
</script>
</body>
</html>
